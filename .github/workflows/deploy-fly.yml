name: Deploy existing Fly apps
run-name: Deploy ${{ inputs.target }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Existing Fly environment to deploy
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      production_confirmation:
        description: Type DEPLOY PRODUCTION for production; leave blank otherwise
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fly-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment:
      name: fly-${{ inputs.target }}
    steps:
      # actions/checkout v6, verified from the official tag on 2026-08-09.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Deploy existing Fly apps
        uses: ./.github/actions/deploy-fly
        with:
          target: ${{ inputs.target }}
          build_verified: 'false'
          production_confirmation: ${{ inputs.production_confirmation }}
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
