name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Nine matrix jobs paid nine installs to run ~20s of checks. One job runs
      # them concurrently and prints a per-gate pass/fail table.
      - name: Run static checks
        run: node scripts/verify.mjs static

  unit-tests:
    name: Tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lodariq_ci_owner
          POSTGRES_PASSWORD: lodariq_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lodariq_ci_owner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LODARIQ_DISPOSABLE_POSTGRES: '1'
      LODARIQ_TEST_POSTGRES_ADMIN_URL: postgresql://lodariq_ci_owner:lodariq_ci_password@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # 325 files on one worker was the whole 20 minutes. Each shard is its own
      # runner with its own Postgres, so splitting cannot share state.
      - name: Run unit and integration tests
        run: pnpm run test -- --shard=${{ matrix.shard }}/4

  build:
    name: Build and bundle checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build packages and applications
        run: pnpm run build

      - name: Check bundle sizes
        run: pnpm run size

      - name: Prepare SDK assets
        env:
          LODARIQ_CDN_ORIGIN: https://dev-cdn.lodariq.io
        run: pnpm run sdk:prepare-assets

      # actions/upload-artifact v7.0.1, verified from the official tag on 2026-08-13.
      - name: Preserve verified Development SDK assets
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lodariq-sdk-assets-${{ github.sha }}
          path: dist/sdk-assets
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Audit production and development dependencies
        run: pnpm run audit:security

  # Its own job, and deliberately not a deploy prerequisite. 0041 is unsigned by
  # design and applied nowhere; deploys never apply migrations. While this sat in
  # the static matrix its intended red hid every other gate and blocked the
  # Development deploy.
  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Check migration safety
        run: node scripts/verify.mjs migrations

  deploy-development:
    name: Deploy Development
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        needs.static-checks.result == 'success' &&
        needs.build.result == 'success' &&
        needs.dependency-audit.result == 'success'
      }}
    needs:
      - static-checks
      - build
      - dependency-audit
    runs-on: ubuntu-latest
    environment:
      name: fly-development
    concurrency:
      group: fly-deploy-development
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Deploy existing Fly apps
        uses: ./.github/actions/deploy-fly
        with:
          target: development
          build_verified: 'true'
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
