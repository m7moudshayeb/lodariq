name: Verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  static-checks:
    name: Static check / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Localization
            command: pnpm run i18n:check
          - name: TypeScript
            command: pnpm run typecheck
          - name: ESLint
            command: pnpm run lint
          - name: Package boundaries
            command: pnpm run boundaries
          - name: Architecture
            command: pnpm run architecture:check
          - name: Unused dependencies
            command: pnpm run knip:check
          - name: Styles
            command: pnpm run styles:check
          - name: Migrations
            command: pnpm run migrations:check
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.name }} check
        run: ${{ matrix.command }}

  unit-tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lodariq_ci_owner
          POSTGRES_PASSWORD: lodariq_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lodariq_ci_owner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LODARIQ_DISPOSABLE_POSTGRES: '1'
      LODARIQ_TEST_POSTGRES_ADMIN_URL: postgresql://lodariq_ci_owner:lodariq_ci_password@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit and integration tests
        run: pnpm run test

  build:
    name: Build and bundle checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages and applications
        run: pnpm run build

      - name: Check bundle sizes
        run: pnpm run size

      - name: Prepare SDK assets
        env:
          LODARIQ_CDN_ORIGIN: https://dev-cdn.lodariq.io
        run: pnpm run sdk:prepare-assets

      # actions/upload-artifact v7.0.1, verified from the official tag on 2026-08-13.
      - name: Preserve verified Development SDK assets
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lodariq-sdk-assets-${{ github.sha }}
          path: dist/sdk-assets
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production and development dependencies
        run: pnpm run audit:security

  deploy-development:
    name: Deploy Development
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        needs.build.result == 'success'
      }}
    needs:
      - static-checks
      - unit-tests
      - build
      - dependency-audit
    runs-on: ubuntu-latest
    environment:
      name: fly-development
    concurrency:
      group: fly-deploy-development
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Deploy existing Fly apps
        uses: ./.github/actions/deploy-fly
        with:
          target: development
          build_verified: 'true'
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
