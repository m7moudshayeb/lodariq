function applyRunStyle(kind,val){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed){ toast('Select some text first.','',2400,'warn'); return }
  pushUndo('text '+kind);
  if(kind==='color'){ document.execCommand('foreColor',false,val) }
  if(kind==='size'){ const r=sel.getRangeAt(0), sp=el('span'); sp.style.fontSize=val+'px';
    try{ r.surroundContents(sp) }catch(e){ document.execCommand('fontSize',false,4) } }
  if(kind==='href'){ if(!val) return; const r=sel.getRangeAt(0), a=document.createElement('a');
    a.className='b-link'; a.setAttribute('data-href',val); a.href='#';
    try{ r.surroundContents(a) }catch(e){} }
  commitText(); drawToolbar(); markDirty();
}

    ${optList(Object.keys(STEP_STYLES).map(k=>({v:k,n:k,i:'palette'})),s.style)}
    <div class="msep"></div>
    ${optList([{v:'#copy',n:'Copy style',i:'copy',k:'⌘⌥C'},{v:'#paste',n:'Paste style',i:'paste',k:'⌘⌥V'},
      {v:'#apply',n:S.multi.size?`Apply to ${S.multi.size} selected steps`:'Apply to…',i:'layers'},
      {v:'#create',n:'Create style from this step…',i:'plus'},
      ...(n?[{v:'#update',n:`Update “${s.style}” (${n} override${n>1?'s':''})`,i:'save'},
            {v:'#reset',n:'Reset instance',i:'refresh'}]:[])])}`,
    {onPick:v=>{
      if(v[0]!=='#'){ pushUndo('step style'); s.style=v; s.overrides={}; paint();

let styleClipboard=null;
function styleAction(a){
  const s=step();
  if(a==='copy'){ styleClipboard={style:s.style,overrides:JSON.parse(JSON.stringify(s.overrides||{}))};
    return toast(`Style copied — ${Object.keys(styleClipboard.overrides).length+1} properties.`,'',2600) }
  if(a==='paste'){ if(!styleClipboard) return toast('Nothing copied yet.','',2200,'warn');
    pushUndo('paste style'); s.style=styleClipboard.style; s.overrides=JSON.parse(JSON.stringify(styleClipboard.overrides));
    paint(); return toast('Style pasted.',`<button class="tb2" data-undo="1">Undo</button>`,4000) }
  if(a==='apply'){
    if(!S.multi.size) return toast('Select steps in the filmstrip first — ⇧-click or ⌘-click, or use Operations → Batch.','',4600,'warn');
    pushUndo('apply style to '+S.multi.size);
    [...S.multi].forEach(i=>{ const t=DOC.steps[i]; if(t){t.style=s.style;t.overrides=JSON.parse(JSON.stringify(s.overrides||{}))} });
    paint(); return toast(`Applied to ${S.multi.size} steps.`,`<button class="tb2" data-undo="1">Undo</button>`,5000,'ok');
  }
  if(a==='create'){
    const name='Style '+(Object.keys(STEP_STYLES).length+1);
    STEP_STYLES[name]={...STEP_STYLES[s.style],...(s.overrides||{})};
    pushUndo('create style'); s.style=name; s.overrides={}; paint();
    return toast(`Created “${name}”. This step now has zero overrides.`,'',4200,'ok');
  }
  if(a==='update'){
    const used=DOC.steps.filter(x=>x.style===s.style).length;
    Object.assign(STEP_STYLES[s.style],s.overrides||{});
    pushUndo('update style'); s.overrides={};
    DOC.steps.forEach(x=>{if(x.style===s.style) x.overrides={}});
    paint();
    return toast(`“${s.style}” updated — ${used} steps changed.`,`<button class="tb2" data-undo="1">Undo</button>`,6000,'ok');
  }
  if(a==='reset'){ pushUndo('reset instance'); s.overrides={}; paint();
    return toast(`Instance reset to “${s.style}”.`,'',2800) }
}

/* ══════════════════════════════════════════════════════════════════════════
   LAYER MANAGER + SOLVER (§3.4)
   One module owns geometry for every Lodariq pixel. Nothing Lodariq draws
   may overlap anything else Lodariq draws; chrome avoids the reserved rect
   (card ∪ target ∪ compass) before the creator notices.
   ══════════════════════════════════════════════════════════════════════════ */
function rectOf(node){ const r=node.getBoundingClientRect(), s=stageRect();
  return {x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height} }
function inflate(r,n){ return {x:r.x-n,y:r.y-n,w:r.w+2*n,h:r.h+2*n} }
function overlaps(a,b){ return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y) }
function unionR(a,b){ if(!a) return b; if(!b) return a;
  const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
  return {x,y,w:Math.max(a.x+a.w,b.x+b.w)-x,h:Math.max(a.y+a.h,b.y+b.h)-y} }

function solve(){
  const s=step(); if(!s) return;
  const R=stageRect(), P=G.stagePadding;
  const card=$('#card'), cw=s.w, ch=card.offsetHeight||160;
  const tEl=findTargetEl(s.target);
  let tR=tEl?rectOf(tEl):null;
  let cx,cy;

  if(tR&&s.form!=='modal'&&s.region==null){
    const off=s.placement.offset, sd=s.placement.side, al=s.placement.align;
    const place=side=>{
      let x,y;
      if(side==='bottom'||side==='top'){
        y=side==='bottom'?tR.y+tR.h+off:tR.y-ch-off;
        x=al==='start'?tR.x:al==='end'?tR.x+tR.w-cw:tR.x+tR.w/2-cw/2;
      } else {
        x=side==='right'?tR.x+tR.w+off:tR.x-cw-off;
        y=al==='start'?tR.y:al==='end'?tR.y+tR.h-ch:tR.y+tR.h/2-ch/2;
      }
      return {x,y};
    };
    let p=place(sd);
    const fits=q=>q.x>=P&&q.y>=P&&q.x+cw<=R.width-P&&q.y+ch<=R.height-P;
    if(!fits(p)&&s.placement.autoFlip){
      const opp={top:'bottom',bottom:'top',left:'right',right:'left'}[sd];
      const q=place(opp);
      if(fits(q)){ p=q; if(s._flipped!==opp){ s._flipped=opp; } }
    } else s._flipped=null;
    cx=p.x; cy=p.y;
  } else {
    /* region-driven form (§5 edge-drag decides the form) */
    const reg=s.region||'center';
    const map={ 'center':[.5,.5],'top':[.5,0],'bottom':[.5,1],'left':[0,.5],'right':[1,.5],
      'top-left':[0,0],'top-right':[1,0],'bottom-left':[0,1],'bottom-right':[1,1] };
    const [fx,fy]=map[reg]||[.5,.5];
    cx=Math.round((R.width-cw)*fx); cy=Math.round((R.height-ch)*fy);
    if(reg==='top'||reg==='bottom') cx=Math.round(R.width/2-cw/2);
  }
  if(s._dragPos){ cx=s._dragPos.x; cy=s._dragPos.y }
  cx=clamp(cx,P,Math.max(P,R.width-cw-P)); cy=clamp(cy,P,Math.max(P,R.height-ch-P));

  const wrap=$('#cwrap'); wrap.style.left=cx+'px'; wrap.style.top=cy+'px';
  const cardR={x:cx,y:cy,w:cw,h:ch};

  /* frame + 8 resize handles */
  const fr=$('#frame');
  if(S.mode==='edit'&&!S.hideChrome){
    fr.style.display=''; fr.style.left=(cx-5)+'px'; fr.style.top=(cy-5)+'px';
    fr.style.width=(cw+10)+'px'; fr.style.height=(ch+10)+'px';
    layoutHandles(cardR);
  } else { fr.style.display='none'; const rw2=$('#rzwrap'); if(rw2) rw2.style.display='none' }

  /* Move / Hide on the card's own corner — the manual fallback for when the
     solver has no good answer (§3.4 rule 4). Automatic avoidance comes first. */
  const ct=$('#cardtools');
  if(S.mode==='edit'&&!S.hideChrome){
    ct.style.display='flex';
    const right=cx+cw+7;
    ct.style.left=(right+22<=R.width-4?right:Math.max(4,cx-29))+'px';
    ct.style.top=cy+'px';
  } else ct.style.display='none';

  /* gutter, outside the card box (§4.2a r6) */
  const gut=$('#gutter'), add=$('#addbtn');
  const selN=S.sel.blockId?$(`#card [data-blk="${S.sel.blockId}"]`):null;
  if(S.mode==='edit'&&selN&&!S.hideChrome){
    const br=rectOf(selN);
    gut.style.display='flex'; gut.style.left=(cx+G.cardGutterOffset)+'px'; gut.style.top=br.y+'px';
    add.style.display='flex'; add.style.left=(cx+cw/2-32)+'px'; add.style.top=(br.y+br.h+2)+'px';
  } else { gut.style.display='none'; add.style.display='none' }

  /* target ring + compass */
  const ring=$('#ring');
  if(tR&&S.mode!=='preview'){
    const st=s.target.styling||{};
    const pad=st.offset??4;
    ring.style.display=''; ring.style.left=(tR.x-pad)+'px'; ring.style.top=(tR.y-pad)+'px';
    ring.style.width=(tR.w+pad*2)+'px'; ring.style.height=(tR.h+pad*2)+'px';
    ring.dataset.state=targetState(s.target);
    ring.style.setProperty('--ring-w',(st.weight||2)+'px');
    ring.style.setProperty('--ring-c',st.color||'var(--b-accent)');
    ring.style.setProperty('--ring-style',st.style||'solid');
    ring.style.borderRadius=st.followRadius!==false
      ? (tEl?getComputedStyle(tEl).borderRadius:'8px') : (st.radius??8)+'px';
    ring.classList.toggle('glow',!!st.glow); ring.classList.toggle('pulse',!!st.pulse);
    drawCompass(tR);
  } else { ring.style.display='none'; $('#cmpring').style.display='none';
    $$('.cmp').forEach(n=>n.remove()); $('#offsetline').style.display='none' }

  /* toolbar: above → below → docked, own minimum width, symmetric overhang */
  const tb=$('#tbar');
  if(S.mode==='edit'&&!S.hideChrome){
    tb.style.display='flex';
    const tw=Math.max(G.toolbarMinWidth,cw);
    let tx=clamp(Math.round(cx+cw/2-tw/2),P,Math.max(P,R.width-tw-P)), ty, tmode;
    const above=cy-G.toolbarGap-G.toolbarHeight, below=cy+ch+G.toolbarGap;
    const hitsTarget=y=>tR&&overlaps({x:tx,y,w:tw,h:G.toolbarHeight},inflate(tR,6));
    const canAbove=above>=P, canBelow=below+G.toolbarHeight<=R.height-P;
    if(canAbove&&!hitsTarget(above)){ ty=above; tmode='above' }
    else if(canBelow&&!hitsTarget(below)){ ty=below; tmode='below' }
    else if(canAbove){ ty=above; tmode='above' }
    else if(canBelow){ ty=below; tmode='below' }
    else { ty=0; tmode='docked' }
    /* hysteresis: only re-solve when the current position is invalid by >24px */
    const prev=S.toolbarSolved;
    if(prev.mode===tmode&&Math.abs(prev.x-tx)<G.resolveHysteresis&&Math.abs(prev.y-ty)<G.resolveHysteresis
       &&prev.w===tw){ tx=prev.x; ty=prev.y }
    S.toolbarSolved={x:tx,y:ty,mode:tmode,w:tw};
    tb.style.width=tw+'px'; tb.style.left=tx+'px'; tb.style.top=ty+'px';
    tb.classList.toggle('docked',tmode==='docked');
  } else tb.style.display='none';

  const tbR=S.mode==='edit'?{x:S.toolbarSolved.x,y:S.toolbarSolved.y,w:S.toolbarSolved.w,h:G.toolbarHeight}:null;
  const reserved=[cardR,tR&&inflate(tR,14),tbR].filter(Boolean);

  /* inspector: flip → shift → corner with a leader line */
  const insp=$('#insp'), lead=$('#leader');
  if(S.inspOpen&&S.mode==='edit'&&!S.hideChrome){
    insp.style.display='flex';
    const ih=Math.min(R.height*G.inspectorMaxHeightRatio,Math.max(G.inspectorMinHeight,insp.offsetHeight||300));
    let ix,iy,pos;
    if(cx+cw+G.inspectorGap+G.inspectorWidth<=R.width-P){ ix=cx+cw+G.inspectorGap; pos='right' }
    else if(cx-G.inspectorGap-G.inspectorWidth>=P){ ix=cx-G.inspectorGap-G.inspectorWidth; pos='left' }
    else { ix=R.width-G.inspectorWidth-P; pos='corner' }
    iy=clamp(cy,P,Math.max(P,R.height-ih-P));
    if(pos==='corner') iy=P;
    if(S.inspDrag){ ix=S.inspDrag.x; iy=S.inspDrag.y; pos='free' }
    insp.style.left=ix+'px'; insp.style.top=iy+'px';
    if(pos==='corner'){
      lead.style.display=''; const ax=cx+cw/2, ay=cy;
      const dx=ix-ax, dy=iy+20-ay, len=Math.hypot(dx,dy);
      lead.style.left=ax+'px'; lead.style.top=ay+'px'; lead.style.width=len+'px';
      lead.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`; lead.style.transformOrigin='0 0';
    } else lead.style.display='none';
    reserved.push({x:ix,y:iy,w:G.inspectorWidth,h:ih});
  } else { insp.style.display='none'; lead.style.display='none' }

  /* non-anchored chrome: quadrant solver, stable preference order */
  placeFloating($('#film'),reserved,R,['bl','br','tl','tr'],'film');
  placeFloating($('#pill'),reserved,R,['br','tr','bl','tl'],'pill');
  S.lastSolve={cardR,tR,reserved,R};
  drawSpotlight(tR,cardR);
}
function placeFloating(node,reserved,R,order,key){
  if(node.style.display==='none') return;
  const P=G.stagePadding, w=node.offsetWidth||200, h=node.offsetHeight||38;
  if(key==='pill'&&S.pill.x!=null){
    node.style.left=clamp(S.pill.x,P,R.width-w-P)+'px';
    node.style.top=clamp(S.pill.y,P,R.height-h-P)+'px'; return;
  }
  const spots={ bl:{x:P,y:R.height-h-P}, br:{x:R.width-w-P,y:R.height-h-P},
    tl:{x:P,y:P+(key==='pill'?0:0)}, tr:{x:R.width-w-P,y:P} };
  const clear=c=>!reserved.some(r=>overlaps(c,r));
  let pick=null;
  for(const k of order){ const c={...spots[k],w,h}; if(clear(c)){ pick=c; break } }
  if(!pick){
    /* nothing is clean: slide the preferred corner along its own edge until it is */
    const base=spots[order[0]];
    for(let dy=0;dy<=R.height*.5;dy+=14){
      const up={x:base.x,y:base.y-dy,w,h};
      if(up.y>=P&&clear(up)){ pick=up; break }
    }
    pick=pick||{...base,w,h};
  }
  node.style.left=pick.x+'px'; node.style.top=pick.y+'px';
}

/* ── 8-edge resize on the card (Tier 1) ─────────────────────────────── */
const HANDLES=[['nw',0,0],['n',.5,0],['ne',1,0],['e',1,.5],['se',1,1],['s',.5,1],['sw',0,1],['w',0,.5]];

function startCardResize(e,h){
  e.preventDefault(); e.stopPropagation();

  const mv=ev=>{
    let dx=ev.clientX-sx, dy=ev.clientY-sy;
    if(h.includes('w')) dx=-dx; if(h.includes('n')) dy=-dy;
    if(h==='n'||h==='s') dx=0; if(h==='e'||h==='w') dy=0;
    const nw=clamp(snap(w0+dx,L.tooltipW.step),L.tooltipW.min,L.tooltipW.max);
    const nh=clamp(snap(h0+dy,L.tooltipH.step),L.tooltipH.min,L.tooltipH.max);
    if(dx) s.w=nw;

}
/* media + button resize handles live on the block itself */

function startMediaResize(e,node,h){
  e.preventDefault(); e.stopPropagation();
  const b=step().blocks.find(x=>x.id===node.dataset.blk);
  const cardW=$('#card').clientWidth-parseFloat(getComputedStyle($('#card')).paddingLeft)*2;

  const tip=el('div'); tip.id='sizetip'; $('#lqlayer').appendChild(tip);

    if(h!=='s'){ const pct=clamp(Math.round(w0+((ev.clientX-sx)/cardW)*100),L.mediaW.min,L.mediaW.max); b.w=pct }
    if(h!=='e'){ b.h=clamp(Math.round(h0+(ev.clientY-sy)),L.mediaH.min,L.mediaH.max) }
    if(lock&&h==='e'){ const [a,c]=b.ratio.split(':').map(Number);
      b.h=clamp(Math.round(cardW*b.w/100*c/a),L.mediaH.min,L.mediaH.max) }

/* ── placement compass (Tier 1): 8 dots + offset drag ───────────────── */
const CMP=[['top','start',.16,-1],['top','center',.5,-1],['top','end',.84,-1],
  ['right','start',-1,.16],['right','center',-1,.5],['right','end',-1,.84],
  ['bottom','start',.16,2],['bottom','center',.5,2],['bottom','end',.84,2],
  ['left','start',3,.16],['left','center',3,.5],['left','end',3,.84]];
function drawCompass(tR){
  $$('.cmp').forEach(n=>n.remove());
  if(S.mode!=='edit'||S.hideChrome) { $('#cmpring').style.display='none'; return }
  const s=step(), off=Math.max(12,s.placement.offset);
  const cr=$('#cmpring');
  cr.style.display=''; cr.style.left=(tR.x-off)+'px'; cr.style.top=(tR.y-off)+'px';
  cr.style.width=(tR.w+off*2)+'px'; cr.style.height=(tR.h+off*2)+'px';
  CMP.forEach(([side,align,fx,fy])=>{
    const d=el('div','cmp'+(align==='center'?'':' mid'));
    let x,y;
    if(side==='top'){ x=tR.x+tR.w*fx; y=tR.y-off }
    if(side==='bottom'){ x=tR.x+tR.w*fx; y=tR.y+tR.h+off }
    if(side==='left'){ x=tR.x-off; y=tR.y+tR.h*fy }
    if(side==='right'){ x=tR.x+tR.w+off; y=tR.y+tR.h*fy }
    d.style.left=(x-6.5)+'px'; d.style.top=(y-6.5)+'px';
    if(s.placement.side===side&&s.placement.align===align) d.classList.add('on');
    d.title=`${side} · align ${align}`;
    d.addEventListener('pointerdown',e=>{
      e.stopPropagation(); e.preventDefault();
      pushUndo('placement');
      s.placement.side=side; s.placement.align=align; s._dragPos=null; paint();
      startOffsetDrag(e,tR,side);
    });
    $('#lqlayer').appendChild(d);
  });
}
function startOffsetDrag(e,tR,side){
  const s=step(), sx=e.clientX, sy=e.clientY, o0=s.placement.offset;
  const line=$('#offsetline');
  let moved=false;
  const mv=ev=>{
    const d=(side==='top')?(sy-ev.clientY):(side==='bottom')?(ev.clientY-sy)
      :(side==='left')?(sx-ev.clientX):(ev.clientX-sx);
    if(Math.abs(d)<3&&!moved) return;
    moved=true;
    s.placement.offset=clamp(Math.round(o0+d),0,96);
    paint();
    const cr=S.lastSolve.cardR;
    line.style.display='';
    if(side==='top'||side==='bottom'){
      const y=side==='bottom'?tR.y+tR.h:cr.y+cr.h;
      line.style.left=(tR.x+tR.w/2)+'px'; line.style.top=y+'px';
      line.style.width=s.placement.offset+'px'; line.style.transform='rotate(90deg)';
      line.style.transformOrigin='0 0';
    } else {
      const x=side==='right'?tR.x+tR.w:cr.x+cr.w;
      line.style.left=x+'px'; line.style.top=(tR.y+tR.h/2)+'px';
      line.style.width=s.placement.offset+'px'; line.style.transform='none';
    }
    line.innerHTML=`<b>${s.placement.offset}px</b>`;
  };
  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    line.style.display='none'; if(moved) toast(`Offset ${s.placement.offset}px`,'',1800) };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

/* ── drag the card itself (announcement/checklist form comes from region) ── */
function startCardDrag(e,fromGrip){
  const s=step(), R=stageRect();
  const r=S.lastSolve.cardR;
  const ox=fromGrip?r.w/2:e.clientX-R.left-r.x, oy=fromGrip?18:e.clientY-R.top-r.y;
  let moved=!!fromGrip, hint=null;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-(R.left+r.x+ox),ev.clientY-(R.top+r.y+oy))<5) return;
    moved=true;
    s._dragPos={x:ev.clientX-R.left-ox,y:ev.clientY-R.top-oy};
    solve();
    if(DOC.type!=='tour'||!s.target){
      const reg=regionFor(s._dragPos,r,R);
      if(!hint){hint=el('div','toast');hint.style.cssText='position:absolute;z-index:110;left:50%;top:14px;transform:translateX(-50%)';
        $('#lqlayer').appendChild(hint)}
      hint.innerHTML=`${icon('move',14)} Drop here → <b style="color:#fff">${FORM_FOR[reg]||'floating card'}</b>`;
    }
  };
  const up=ev=>{
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    if(hint) hint.remove();
    if(!moved) return;
    pushUndo('move card');
    if(!s.target){
      const reg=regionFor(s._dragPos,r,R);
      s.region=reg; s.form=FORM_KEY[reg]; s._dragPos=null;
      toast(`Dropped at the ${reg.replace('-',' ')} — this is now a <b style="color:#fff">${FORM_FOR[reg]}</b>.`,'',4200,'ok');
    }
    paint();
  };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}
const FORM_FOR={center:'centred modal',top:'top banner',bottom:'bottom banner',left:'left drawer',
  right:'right drawer','top-left':'floating card','top-right':'floating card',
  'bottom-left':'floating card','bottom-right':'floating card'};
const FORM_KEY={center:'modal',top:'banner',bottom:'banner',left:'drawer',right:'drawer',
  'top-left':'floating','top-right':'floating','bottom-left':'floating','bottom-right':'floating'};
function regionFor(p,r,R){
  const cx=p.x+r.w/2, cy=p.y+r.h/2, ex=R.width*.18, ey=R.height*.18;
  const l=cx<ex, rr=cx>R.width-ex, t=cy<ey, b=cy>R.height-ey;
  if(t&&l) return 'top-left'; if(t&&rr) return 'top-right';
  if(b&&l) return 'bottom-left'; if(b&&rr) return 'bottom-right';
  if(t) return 'top'; if(b) return 'bottom'; if(l) return 'left'; if(rr) return 'right';
  return 'center';
}

/* ── spotlight backdrop, one soft mask (wishlist 1.1) ───────────────── */
function drawSpotlight(tR,cardR){
  const s=step(), sp=$('#spot');
  const active=(S.mode==='preview'&&s.spotlight?.on);
  if(!active){ sp.classList.remove('on','clickable'); sp.style.background=''; return }
  const dim=s.spotlight.dim??.5;
  const R=stageRect();
  sp.style.background=`rgba(6,8,15,${dim})`;
  if(tR){
    const h=inflate(tR,10), cx2=h.x+h.w/2, cy2=h.y+h.h/2;

function startPillDrag(e){

    p.classList.remove('dragging');

/* ══════════════════════════════════════════════════════════════════════════
   FILMSTRIP (§4.5) — thumbnail, title, state dot, insert-between, multi-select
   ══════════════════════════════════════════════════════════════════════════ */
function drawFilm(){
  const f=$('#film');
  if(S.mode!=='edit'||S.hideChrome){ f.style.display='none'; return }
  f.style.display='flex';
  let h=`<div class="fhead">Steps</div>`;
  DOC.steps.forEach((s,i)=>{
    const st=targetState(s.target);
    const peer=DOC.presenceOn&&DOC.peers.find(p=>p.step===s.id);
    const branched=DOC.branches.some(b=>b.from===s.id);
    h+=`<div class="finsert" data-ins="${i}" title="Insert a step here"><span>+</span></div>
      <div class="fcell"><div class="fs ${S.step===i?'on':''} ${S.multi.has(i)?'multi':''}" data-s="${i}"
        draggable="false" title="${esc(s.title)} — ${STATE_WORD[st]}">
        <div class="thumb">${s.blocks.slice(0,3).map((b,j)=>
          `<i class="${j===0?'a':j===1?'b':'c'}"></i>`).join('')}<span class="bt"></span></div>
        <div class="ttl">${esc(s.title)}</div>
        <span class="nb">${i+1}</span>
        <span class="sdot ${peer&&peer.holding?'peer':st}"></span>
        ${branched?`<span class="brc" title="Branches from here">${icon('branch',11)}</span>`:''}
        ${peer&&peer.holding?`<span class="lockc" title="${esc(peer.name)} is editing">${icon('lock',11)}</span>`:''}
      </div></div>`;
  });
  h+=`<div class="finsert" data-ins="${DOC.steps.length}"><span>+</span></div>
    <button class="fadd" title="Add a step at the end">${icon('plus',16)}</button>`;
  f.innerHTML=h;
  $$('.fs[data-s]',f).forEach(n=>{
    const i=+n.dataset.s;
    n.addEventListener('pointerdown',e=>startStepDrag(e,n,i));
    n.addEventListener('click',e=>{
      if(n._dragged) return;
      if(e.shiftKey){ const a=Math.min(S.step,i),b=Math.max(S.step,i);
        S.multi.clear(); for(let k=a;k<=b;k++) S.multi.add(k); }
      else if(e.metaKey||e.ctrlKey){ S.multi.has(i)?S.multi.delete(i):S.multi.add(i) }
      else { S.multi.clear(); goStep(i); return }
      drawFilm();
    });
    n.addEventListener('contextmenu',e=>{e.preventDefault();stepMenu(n,i)});
  });
  $$('[data-ins]',f).forEach(n=>n.onclick=()=>insertStep(+n.dataset.ins));
  $('.fadd',f).onclick=()=>insertStep(DOC.steps.length);
}
const STATE_WORD={ok:'Verified',ctx:'Needs context',bad:"Can't find",draft:'Draft'};
function stepMenu(anchor,i){
  menu(anchor,`<div class="mh">Step ${i+1}</div>
    ${optList([{v:'settings',n:'Step settings',i:'settings',k:'⌘/'},{v:'dup',n:'Duplicate step',i:'copy'},
      {v:'branch',n:'Branch from this step',i:'branch'},{v:'retarget',n:'Change target',i:'crosshair'},
      {v:'lock',n:'Ask for this step',i:'lock'},{v:'comment',n:'Comment on this step',i:'quote'},
      {v:'del',n:'Delete step',i:'trash'}])}`,
    {onPick:v=>{
      if(v==='settings'){ goStep(i); S.inspOpen=true; paint() }
      if(v==='dup'){ pushUndo('duplicate step');
        const c=JSON.parse(JSON.stringify(DOC.steps[i])); c.id=uid('s'); c.title+=' copy';
        c.blocks.forEach(b=>b.id=uid('b'));
        DOC.steps.splice(i+1,0,c); goStep(i+1); toast('Step duplicated.','',2200) }
      if(v==='branch'){ openOps('map'); setTimeout(()=>startBranchFrom(DOC.steps[i].id),260) }
      if(v==='retarget'){ goStep(i); enterPicker('change') }
      if(v==='lock'){ toast(`Asked ${DOC.peers[0].name} for step ${i+1}.`,'',3000) }
      if(v==='comment'){ openOps('collab') }
      if(v==='del'){ if(DOC.steps.length<2) return toast('A tour needs at least one step.','',2400,'warn');
        pushUndo('delete step'); DOC.steps.splice(i,1); DOC.branches=DOC.branches.filter(b=>b.from!==DOC.steps[i]?.id);
        goStep(clamp(S.step,0,DOC.steps.length-1));
        toast('Step deleted.',`<button class="tb2" data-undo="1">Undo</button>`,5000) }
    }});
}
function startStepDrag(e,node,i){
  const sx=e.clientX; node._dragged=false;
  let ghostIdx=i;
  const mv=ev=>{
    if(!node._dragged&&Math.abs(ev.clientX-sx)<6) return;
    node._dragged=true; node.classList.add('dragging');
    const cells=$$('#film .fs');
    let t=i;
    cells.forEach((c,k)=>{ const r=c.getBoundingClientRect();
      if(ev.clientX>r.left+r.width/2) t=k });
    if(t!==ghostIdx){ ghostIdx=t;
      $$('#film .finsert').forEach(n=>n.classList.remove('armed'));
      const ins=$(`#film [data-ins="${t+ (t>=i?1:0)}"]`); if(ins) ins.classList.add('armed') }
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    node.classList.remove('dragging');
    $$('#film .finsert').forEach(n=>n.classList.remove('armed'));
    if(node._dragged&&ghostIdx!==i){
      pushUndo('reorder steps');
      const [s]=DOC.steps.splice(i,1); DOC.steps.splice(ghostIdx,0,s);
      S.step=ghostIdx; paint();
      announce(`Step moved to position ${ghostIdx+1} of ${DOC.steps.length}`);
      toast(`Moved to position ${ghostIdx+1}.`,`<button class="tb2" data-undo="1">Undo</button>`,4200);
    }
    setTimeout(()=>node._dragged=false,40);
  };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}
function insertStep(at){
  pushUndo('insert step');

    overrides:{},w:330,h:null,placement:{side:'bottom',align:'start',offset:12,autoFlip:true},
    motion:{recipe:'fade',easing:'standard',durationMs:280},
    narration:{script:'',voice:'Aria · en-GB',autoAdvance:true,offsetMs:0},
    conditions:[],transitions:{advanceOn:'manual',next:{type:'next'}},
    spotlight:{on:false,dim:.5,clickThrough:'nothing'},zoom:{on:false,scale:1.2},
    blocks:[blk('heading',{text:'New step',level:1}),
      blk('paragraph',{runs:[{t:'Tell them what to do here.',marks:[]}]}),
      blk('actions',{layout:'inline',align:'start',gap:8,items:[
        {id:uid('a'),label:'Next',variant:'primary',size:'regular',action:'next',icon:'none',width:'hug',widthPx:null}]})]};
  DOC.steps.splice(at,0,s); S.step=at; S.multi.clear(); paint();

function goStep(i){

function announce(msg){

function blockMenu(anchor,i){
  const b=step().blocks[i];
  menu(anchor,`<div class="mh">${b.type} block</div>
    ${optList([{v:'up',n:'Move up',i:'arrowU'},{v:'down',n:'Move down',i:'arrowD'},
      {v:'dup',n:'Duplicate',i:'copy'},{v:'cond',n:b.showWhen?'Edit visibility rule':'Show only to some people…',i:'filter'},
      {v:'settings',n:'Open in the inspector',i:'settings',k:'⌘/'},{v:'del',n:'Delete',i:'trash'}])}`,
    {onPick:v=>{
      const S2=step();
      if(v==='up'&&i>0){ pushUndo('move block'); [S2.blocks[i-1],S2.blocks[i]]=[S2.blocks[i],S2.blocks[i-1]] }
      if(v==='down'&&i<S2.blocks.length-1){ pushUndo('move block'); [S2.blocks[i+1],S2.blocks[i]]=[S2.blocks[i],S2.blocks[i+1]] }
      if(v==='dup'){ pushUndo('duplicate block'); const c=JSON.parse(JSON.stringify(b)); c.id=uid('b');
        if(c.items) c.items.forEach(x=>x.id=uid('a')); S2.blocks.splice(i+1,0,c) }
      if(v==='del'){ pushUndo('delete block'); S2.blocks.splice(i,1); S.sel={kind:'card',blockId:null,actionId:null} }

function conditionalContentMenu(anchor,b){

    ${optList([{v:'',n:'Always (no rule)'},
      ...DOC.attributes.map(a=>({v:'identifyTrait:'+a.key,n:`${a.key} is set`})),
      {v:'completedStep:s2',n:'They completed “Create a project”'},
      {v:'locale:de',n:'Their locale is Deutsch'}],
      b.showWhen?b.showWhen.source+':'+(b.showWhen.key||b.showWhen.stepId||b.showWhen.locale):'')}
    <div class="msep"></div><div class="mnote">This varies content inside one step. Branching between steps lives in the flow map.</div>`,
    {onPick:v=>{
      pushUndo('conditional content');
      if(!v) b.showWhen=null;
      else { const [src,key]=v.split(':');
        b.showWhen=src==='identifyTrait'?{source:src,key,op:'exists',value:''}
          :src==='completedStep'?{source:src,stepId:key}:{source:src,locale:key} }
      paint();
      toast(b.showWhen?'Rule set. Dimmed blocks are hidden for the current test user.':'Rule removed.','',3400);
    }});
}
function evalCond(c){
  if(!c) return true;
  if(c.source==='identifyTrait'){ const v=S.identify[c.key];
    return c.op==='exists'?v!=null&&v!=='':c.op==='equals'?String(v)===String(c.value):String(v)!==String(c.value) }
  if(c.source==='completedStep') return stepIndex(c.stepId)<S.step;
  if(c.source==='locale') return DOC.locale===c.locale;
  if(c.source==='documentState'){ const v=S.identify[c.key];
    return c.op==='exists'?!!v:c.op==='equals'?String(v)===String(c.value):String(v)!==String(c.value) }
  if(c.source==='namedEvent') return false;
  return true;
}
function startBlockDrag(e){

function matchCount(t){

  const e=findTargetEl(t); if(!e) return 0;
  const name=e.dataset.name, role=e.dataset.role;

function replayApproach(){
  const s=step(), ap=s.target.approach||defaultApproach(s.target);
  toast(`Replaying ${ap.length} conditions…`,'',1400);
  let i=0;
  const run=()=>{
    if(i>=ap.length){ toast(`Replay complete — <span style="color:var(--c-ok)">pass</span>. Resolved in 840 ms.`,'',4200,'ok');
      return }
    const line=ap[i].replace(/<\/?b>/g,'');
    if(/Import\b/.test(line)&&APP.route==='projects'){ const btn=$('#appwin [data-lq="btn-import"]');
      if(btn) openAppPop('import',btn) }
    if(/CSV/.test(line)) { /* menu already open */ }
    toast(`${i+1}. ${esc(line)} <span style="color:var(--c-ok)">✓</span>`,'',1500);
    i++; setTimeout(run,760);
  };
  setTimeout(run,300);
}

        <div style="font-size:11.5px;color:var(--c-mut)" id="dictate-txt">“…”</div></div>
      <button class="sbtn" id="dictate-stop">${icon('pause',14)}Stop</button></div>`);
  const words=('Everything starts with a project. Click Create project to make your first one, '+
    'and give it a name you will recognise in a week.').split(' ');
  let i=0; const t=setInterval(()=>{
    i++; const n=$('#dictate-txt'); if(!n){clearInterval(t);return}
    n.textContent='“'+words.slice(0,i).join(' ')+'”';
    if(i>=words.length){ clearInterval(t); setTimeout(()=>{
      pushUndo('dictate'); s.narration.script=words.join(' '); closeBigModal(); paint();
      toast('Transcribed into the spoken script. The step text is untouched.','',4600,'ok') },700) }
  },110);
  on('dictate-stop','click',()=>{clearInterval(t);closeBigModal()});
}
/* ══════════════════════════════════════════════════════════════════════════
   TARGET SYSTEM (§4.4) — pick by meaning. Never a selector, never DOM depth.
   Hover card with a live match count · plain-language ancestor breadcrumb ·
   Pick bigger / Pick smaller · automatic page freeze · disambiguation.
   ══════════════════════════════════════════════════════════════════════════ */
let PICK={reason:'new',hover:null,path:[],idx:0,pinned:false};
function enterPicker(reason){
  PICK={reason,hover:null,path:[],idx:0,pinned:false};
  S.frozen=false;
  setMode('picking');
  announce('Target picker. Click the thing this step should point at. Escape cancels.');
}
function exitPicker(cancel){
  setMode('edit'); S.frozen=false;
  $('#hilite').style.display='none'; killHover();
  if(cancel) toast('Target unchanged.','',2000);
}
/* plain-language ancestor chain, built from data-name/data-role only */
function plainPath(node){
  const out=[]; let n=node;
  while(n&&n.id!=='appwin'){
    if(n.dataset&&n.dataset.name) out.unshift({n,label:n.dataset.name,role:n.dataset.role});
    else if(n.classList){
      const c=n.classList;
      const label=c.contains('a-top')?'Header':c.contains('a-side')?'Sidebar':c.contains('a-main')?'Main area'
        :c.contains('a-modal')?'Dialog':c.contains('a-pop')?'Menu':c.contains('a-card')?'Card'
        :c.contains('a-tbl')?'Table':c.contains('a-actions')?'Toolbar':c.contains('a-kanban')?'Board'
        :c.contains('a-col')?'Column':c.contains('a-ticket')?'Card':null;
      if(label) out.unshift({n,label,role:'region'});
    }
    n=n.parentElement;
  }
  out.unshift({n:$('#appwin'),label:'Page',role:'page'});
  return out;
}
function liveMatches(node){
  if(!node.dataset||!node.dataset.role) return {exact:1,similar:1};
  const same=$$(`#appwin [data-role="${node.dataset.role}"]`);
  const exact=same.filter(x=>x.dataset.name===node.dataset.name);
  return {exact:exact.length,similar:same.length};
}
function paintHilite(node,alt){
  const h=$('#hilite'); if(!node){h.style.display='none';return}
  const r=rectOf(node);
  h.style.display=''; h.classList.toggle('alt',!!alt);
  h.style.left=r.x+'px'; h.style.top=r.y+'px'; h.style.width=r.w+'px'; h.style.height=r.h+'px';
}
let hoverNode=null;
function killHover(){ if(hoverNode){hoverNode.remove();hoverNode=null} }
function showHoverCard(node,x,y){
  killHover();
  const m=liveMatches(node), sr=stageRect(), r=rectOf(node);
  const c=el('div','hovcard'+(PICK.pinned?' pinned':''));
  c.innerHTML=`<div class="t">${icon('crosshair',13)}${esc(cap(node.dataset.role||'element'))} ·
      ${esc(node.dataset.name||'unnamed')}</div>
    <div class="m">${Math.round(r.w)} × ${Math.round(r.h)} px${
      Math.min(r.w,r.h)<G.tapMin?` · <span style="color:#f7bd5c">under ${G.tapMin}×${G.tapMin}</span>`:''}</div>
    <div class="cnt">${icon('target',12)}${m.exact} of ${m.similar} on this page look like this</div>
    <div class="pinhint">${PICK.pinned?'Pinned — click elsewhere to unpin':'Click the card to pin it'}</div>`;
  c.style.left=clamp(x-sr.left+14,8,sr.width-292)+'px';
  c.style.top=clamp(y-sr.top+14,8,sr.height-140)+'px';
  c.onclick=e=>{e.stopPropagation(); PICK.pinned=!PICK.pinned; showHoverCard(node,x,y)};
  $('#floats').appendChild(c); hoverNode=c;
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function drawBands(){
  const bands=$('#bands'); bands.innerHTML='';
  /* step lock banner (§15.2) */
  const peer=DOC.presenceOn&&DOC.peers.find(p=>p.step===step()?.id&&p.holding);
  if(peer&&S.mode==='edit'){
    const b=el('div','band');
    b.style.top='0px';
    b.innerHTML=`${icon('lock',15)}<span><b>${esc(peer.name)}</b> is editing this step — you are read-only.</span>
      <div class="grow"></div>
      <button class="bb" id="askfor">Ask for it</button>
      <button class="bb" id="dupinstead">Duplicate instead</button>`;
    bands.appendChild(b);
    on('askfor','click',()=>{toast(`Asked ${peer.name} for step ${S.step+1}. They keep it until they release it or the 90s heartbeat lapses.`,'',5000);
      setTimeout(()=>{peer.holding=false;paint();toast(`${peer.name} released step ${S.step+1}.`,'',3200,'ok')},2600)});
    on('dupinstead','click',()=>stepMenu($('#film .fs.on'),S.step));
  }
  if(S.mode!=='picking') return;
  /* picker instruction band — never a moment in the picker without being told so */
  const top=el('div','band');
  top.style.top='0px';
  top.innerHTML=`${icon('crosshair',15)}
    <span><b>Click the thing this step should point at.</b></span>
    <div class="grow"></div>
    ${S.frozen?`<span class="tag w">${icon('lock',10)}Page frozen</span>
      <button class="bb" id="unfreeze">Unfreeze</button>`
      :`<button class="bb" id="freeze">${icon('lock',13)}Freeze page</button>`}
    <button class="bb" id="pickcancel">Cancel</button>`;
  bands.appendChild(top);
  on('freeze','click',()=>{S.frozen=true;drawBands();toast('Page frozen. Menus and dialogs stay open while you pick.','',3600)});
  on('unfreeze','click',()=>{S.frozen=false;drawBands()});
  on('pickcancel','click',()=>exitPicker(true));
  /* breadcrumb band — every crumb is a click target */
  const bot=el('div','band bot');
  bot.style.bottom='0px';
  const path=PICK.path.length?PICK.path:[{label:'Page',role:'page'}];
  bot.innerHTML=`<div class="crumb">${path.map((p,i)=>
      `<button class="${i===PICK.idx?'on':''}" data-crumb="${i}">${esc(p.label)}</button>
       ${i<path.length-1?`<span class="sl">${icon('chevR',11)}</span>`:''}`).join('')}</div>
    <div class="grow"></div>
    <button class="bb" id="pickbigger" ${PICK.idx<=0?'disabled':''}>${icon('maximize',13)}Pick bigger</button>
    <button class="bb" id="picksmaller" ${PICK.idx>=path.length-1?'disabled':''}>${icon('minimize',13)}Pick smaller</button>
    <button class="bb pri" id="pickuse" ${PICK.path.length?'':'disabled'}>${icon('check',13)}Use this</button>`;
  bands.appendChild(bot);
  $$('[data-crumb]',bot).forEach(n=>{
    n.onclick=()=>{ PICK.idx=+n.dataset.crumb; paintHilite(PICK.path[PICK.idx].n); drawBands() };
    n.onmouseenter=()=>paintHilite(PICK.path[+n.dataset.crumb].n,true);
    n.onmouseleave=()=>paintHilite(PICK.path[PICK.idx]?.n);
  });
  on('pickbigger','click',()=>{PICK.idx=Math.max(0,PICK.idx-1);paintHilite(PICK.path[PICK.idx].n);drawBands()});
  on('picksmaller','click',()=>{PICK.idx=Math.min(PICK.path.length-1,PICK.idx+1);paintHilite(PICK.path[PICK.idx].n);drawBands()});
  on('pickuse','click',()=>commitTarget(PICK.path[PICK.idx].n));
}
function commitTarget(node){
  if(!node||!node.dataset.name){ return toast('That region has no accessible name — pick something inside it.','',3600,'warn') }
  const m=liveMatches(node);
  if(m.similar>1&&m.exact>=1){ return disambiguate(node,m) }
  finishTarget(node,'unique');
}
function disambiguate(node,m){
  /* §4.4a — a plain-language chooser, not a modifier key and not a slider */
  const others=$$(`#appwin [data-role="${node.dataset.role}"]`);
  const isRow=node.dataset.role==='table row';
  const opts=[
    {v:'unique',n:'Just the one I clicked'},
    {v:'anyMatching',n:`Any ${node.dataset.role} that says “${node.dataset.name}”`},
    {v:'nth',n:`The ${ordinal(others.indexOf(node)+1)} one, in reading order`},
    {v:'first',n:'Any of them — first one wins'},
    ...(isRow?[{v:'newest',n:'The row for the newest project'},
      {v:'firstInList',n:'The first item in this list'}]:[]),
    {v:'insideCard',n:`The ${node.dataset.role} inside the “${nearestCardTitle(node)}” area`}
  ];
  bigModal(`${others.length} things on this page look like this one.`,
    `<div class="bd">Answer in words. Each option highlights its matches while you hover it.</div>
     <ul class="lst" id="dis-opts">${opts.map(o=>`<li data-dis="${o.v}" style="cursor:pointer">
       <span style="display:flex;align-items:center;gap:10px">
       <span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--c-ctl-b);flex:none"
         data-radio="${o.v}"></span>${esc(o.n)}</span>
       <span class="tag n" data-cnt="${o.v}"></span></li>`).join('')}</ul>`,
    [{n:'Cancel',f:()=>{closeBigModal()}},
     {n:'Use this',pri:true,f:()=>{ finishTarget(node,PICK.res||'unique'); closeBigModal() }}]);
  const counts={unique:1,anyMatching:others.filter(x=>x.dataset.name===node.dataset.name).length,
    nth:1,first:1,newest:1,firstInList:1,insideCard:1};
  $$('[data-cnt]').forEach(n=>n.textContent=counts[n.dataset.cnt]+' match'+(counts[n.dataset.cnt]===1?'':'es'));
  PICK.res='unique';
  $$('[data-dis]').forEach(n=>{
    n.onmouseenter=()=>{ const v=n.dataset.dis;
      const set=v==='unique'||v==='nth'?[node]
        :v==='anyMatching'?others.filter(x=>x.dataset.name===node.dataset.name)
        :v==='first'?[others[0]]:v==='newest'?[$('#appwin [data-newest="1"]')||node]
        :v==='firstInList'?[others[0]]:[node];
      showMulti(set.filter(Boolean)) };
    n.onmouseleave=()=>showMulti([]);
    n.onclick=()=>{ PICK.res=n.dataset.dis;
      $$('[data-radio]').forEach(r=>{r.style.background=r.dataset.radio===PICK.res?'var(--c-action)':'';
        r.style.borderColor=r.dataset.radio===PICK.res?'var(--c-action)':'var(--c-ctl-b)'}) };
  });
  $$('[data-dis]')[0].click();
}
function ordinal(n){return n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th')}
function nearestCardTitle(node){
  const c=node.closest('.a-card,.a-modal,.a-tbl,.a-main');
  return c?.querySelector('h1,h2,h3')?.textContent?.trim()||'Projects';
}
let multiNodes=[];
function showMulti(list){
  multiNodes.forEach(n=>n.remove()); multiNodes=[];
  list.forEach(n=>{ const r=rectOf(n), d=el('div');
    d.style.cssText=`position:absolute;z-index:106;pointer-events:none;left:${r.x}px;top:${r.y}px;
      width:${r.w}px;height:${r.h}px;border:2px solid var(--c-action);border-radius:5px;
      background:rgba(124,140,255,.16)`;
    $('#lqlayer').appendChild(d); multiNodes.push(d) });
}
function finishTarget(node,res){
  showMulti([]);
  const s=step();
  pushUndo('set target');
  s.target={route:APP.route,key:node.dataset.lq,name:node.dataset.name,role:node.dataset.role,
    resolution:res,styling:s.target?.styling||{},
    approach:APP.pop||APP.modal?['Click <b>'+(APP.pop?'Import':'the button')+'</b> on the '+APP.route+' page',
      'Wait for the <b>'+(APP.modal?'dialog':'menu')+'</b> to appear',
      'Then find <b>'+node.dataset.name+'</b>']:null};
  if(!s.region) s.form='tooltip';
  s.region=null; s._dragPos=null;
  if(PICK.reason==='new'&&s.title==='New step') s.title=node.dataset.name.slice(0,28);
  exitPicker(false);
  paint();
  const st=targetState(s.target);
  toast(`Pointed at “${esc(node.dataset.name)}” — <b style="color:#fff">${STATE_WORD[st]}</b>${
    s.target.approach?'. The route you took was captured as an approach.':'.'}`,
    `<button class="tb2" data-undo="1">Undo</button>`,5200,'ok');
}

/* picker event plumbing — installed once, gated on S.mode */
function installPickerEvents(){
  const win=$('#appwin');
  win.addEventListener('mousemove',e=>{
    if(S.mode!=='picking') return;
    const n=e.target.closest('[data-lq]')||e.target;
    if(n===PICK.hover) { if(!PICK.pinned&&hoverNode) { const sr=stageRect();
        hoverNode.style.left=clamp(e.clientX-sr.left+14,8,sr.width-292)+'px';
        hoverNode.style.top=clamp(e.clientY-sr.top+14,8,sr.height-140)+'px' } return }
    PICK.hover=n; PICK.path=plainPath(n); PICK.idx=PICK.path.length-1;
    paintHilite(PICK.path[PICK.idx].n);
    if(!PICK.pinned&&PICK.path[PICK.idx].n.dataset?.name) showHoverCard(PICK.path[PICK.idx].n,e.clientX,e.clientY);
    drawBands();
  },true);
  win.addEventListener('click',e=>{
    if(S.mode==='picking'){
      const n=e.target.closest('[data-lq]');
      const opener=e.target.closest('[data-pop],[data-modal]');
      e.preventDefault(); e.stopPropagation();
      /* A control that opens something has two honest readings. Ask, never guess. */
      if(opener&&!(S.frozen&&opener.dataset.lq&&opener.closest('.a-pop,.a-modal')))
        return openerChoice(e,opener);
      if(!n){ return toast('Nothing nameable there. Use the breadcrumb, or Pick bigger.','',3000,'warn') }
      commitTarget(PICK.path[PICK.idx]?.n||n);
      return;
    }
    if(S.recording){
      const n=e.target.closest('[data-lq]');
      if(n) recordClick(n.dataset.lq,n.dataset.name,n.dataset.role);
    }
  },true);
}

/* This thing opens something. Do you want it, or what is inside it? */
function openerChoice(e,opener){
  const label=opener.dataset.name||'this control';
  menu(opener,`<div class="mh">${esc(label)} opens something</div>
    ${optList([{v:'self',n:`Point at “${label}” itself`,i:'crosshair'},
      {v:'inside',n:'Open it and pick something inside',i:'layers'}])}
    <div class="msep"></div><div class="mnote">Opening it freezes the page automatically, so the menu stays
      put while you pick — and the route you took is captured as this step's approach.</div>`,
    {onPick:v=>{
      if(v==='self') return commitTarget(opener);
      S.frozen=true; drawBands();
      if(opener.dataset.pop) openAppPop(opener.dataset.pop,opener); else openAppModal(opener.dataset.modal);
    }});
}

/* ══════════════════════════════════════════════════════════════════════════
   RECORD-TO-AUTHOR (wishlist 3.1) — click through the flow once, get steps.
   ══════════════════════════════════════════════════════════════════════════ */
function toggleRecording(fromApproach){
  if(S.recording){
    S.recording=false; document.body.classList.remove('recording');
    const n=S.recorded.length;
    setMode('edit');
    if(!n){ toast('Nothing recorded.','',2400); return drawBands() }
    if(fromApproach){
      const s=step();
      s.target.approach=S.recorded.map((r,i)=>i<S.recorded.length-1
        ?`Click <b>${esc(r.name)}</b>`:`Then find <b>${esc(r.name)}</b>`);
      S.recorded=[]; paint();
      return toast(`Approach re-recorded — ${n} conditions.`,'',4000,'ok');
    }
    reviewRecording();
    return;
  }
  S.recording=true; S.recorded=[]; setMode('browse');
  toast(`Recording. Click through your product the way a new user would — every click becomes a step skeleton.
    <button class="tb2" data-stoprec="1">Stop</button>`,'',9000,'ok');
  setTimeout(()=>$$('[data-stoprec]').forEach(b=>b.onclick=()=>toggleRecording(fromApproach)),10);
}
function recordClick(key,name,role){
  if(!S.recording) return;
  if(S.recorded.at(-1)?.key===key) return;
  S.recorded.push({key,name,role,route:APP.route});
  toast(`${S.recorded.length}. ${esc(name)} captured`,'',1400);
}
function reviewRecording(){
  const drafts=S.recorded.map((r,i)=>({...r,copy:draftCopyFor(r)}));
  bigModal(`Recorded ${drafts.length} steps`,
    `<div class="bd">Targets captured semantically, approach recipes recorded, placement guessed, and copy
      drafted from each element's accessible name. Edit anything before you keep it.</div>
     <table class="dt"><thead><tr><th style="width:26px"></th><th>Target</th><th>Drafted copy</th><th>Placement</th></tr></thead>
     <tbody>${drafts.map((d,i)=>`<tr><td>${i+1}</td>
       <td class="k">${esc(d.name)}<div style="font-size:10px;color:var(--c-subtle)">${esc(d.role)} · ${esc(d.route)}</div></td>
       <td contenteditable="true" class="editable" data-draft="${i}">${esc(d.copy)}</td>
       <td><span class="tag n">${['bottom','right','bottom','left'][i%4]}</span></td></tr>`).join('')}</tbody></table>`,
    [{n:'Discard',f:()=>{S.recorded=[];closeBigModal()}},
     {n:`Add ${drafts.length} steps`,pri:true,f:()=>{
       pushUndo('record to author');
       $$('[data-draft]').forEach(n=>drafts[+n.dataset.draft].copy=n.textContent);
       drafts.forEach((d,i)=>{
         DOC.steps.push({id:uid('s'),title:d.name.slice(0,28),
           target:{route:d.route,key:d.key,name:d.name,role:d.role,resolution:'unique',styling:{},
             approach:drafts.slice(0,i+1).map((x,j)=>j<i?`Click <b>${esc(x.name)}</b>`:`Then find <b>${esc(x.name)}</b>`)},
           region:null,form:'tooltip',style:'Primary card',overrides:{},w:330,h:null,
           placement:{side:['bottom','right','bottom','left'][i%4],align:'start',offset:12,autoFlip:true},
           motion:{recipe:'fade',easing:'standard',durationMs:280},
           narration:{script:d.copy,voice:'Aria · en-GB',autoAdvance:true,offsetMs:0},
           conditions:[],transitions:{advanceOn:'observeTargetClick',next:{type:'next'},
             waitFor:'targetAvailable',timeoutMs:8000,onTimeout:'stay'},
           spotlight:{on:true,dim:.5,clickThrough:'nothing'},zoom:{on:false,scale:1.2},
           blocks:[blk('heading',{text:d.name,level:1}),
             blk('paragraph',{runs:[{t:d.copy,marks:[]}]}),
             blk('actions',{layout:'inline',align:'start',gap:8,items:[
               {id:uid('a'),label:'Next',variant:'primary',size:'regular',action:'next',icon:'none',width:'hug',widthPx:null}]})]});
       });
       S.recorded=[]; closeBigModal(); setMode('edit'); goStep(DOC.steps.length-drafts.length);
       toast(`${drafts.length} steps added.`,`<button class="tb2" data-undo="1">Undo</button>`,6000,'ok');
     }}]);
}
function draftCopyFor(r){
  const by={button:`Use ${r.name} to move forward.`,'navigation link':`${r.name} is where this lives.`,
    'menu item':`Choose ${r.name} to continue.`,'table row':`This is a ${r.name.replace(' row','')}.`,
    'text input':`Type your ${r.name.toLowerCase()} here.`,'select':`Pick a ${r.name.toLowerCase()}.`,
    'switch':`Turn ${r.name} on if you want it.`,'card':`${r.name} shows what changed.`};
  return by[r.role]||`This is ${r.name}.`;
}

/* ══════════════════════════════════════════════════════════════════════════
   AI (§7.4 / §7.5) — anchored to a selection, previewed before it applies.
   ══════════════════════════════════════════════════════════════════════════ */
const REWRITES={
  'Shorter':t=>t.split(/(?<=[.!?])\s+/)[0].replace(/,\s.*?(?=\s(and|or|but)\s)/,'')||t,
  'Clearer':t=>t.replace(/\bkeep\b/gi,'hold').replace(/together\./,'in one place.').replace(/Start from/,'Begin with'),
  'More formal':t=>t.replace(/Let's/gi,'Let us').replace(/you'll/gi,'you will').replace(/^(\w)/,(m)=>m.toUpperCase()),
  'Friendlier':t=>t.replace(/\.$/,' — it takes about a minute.').replace(/^/,''),
  'Fix grammar':t=>t.replace(/\s+/g,' ').replace(/\s([,.!?])/g,'$1').trim()
};
function aiRewrite(verb){
  const sel=window.getSelection();
  let b=null;
  if(sel&&!sel.isCollapsed){
    const n=(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement)?.closest('[data-blk]');
    if(n) b=step().blocks.find(x=>x.id===n.dataset.blk);
  }
  /* Scoped to the selection when there is one; otherwise this step's body copy.
     Never the document — that is where scope discipline goes to die (§7.8). */
  b=b||selBlock()||step().blocks.find(x=>x.type==='paragraph')||step().blocks.find(x=>x.type==='heading');
  if(!b||!['paragraph','heading','callout'].includes(b.type))
    return toast('Select some text to rewrite.','',2600,'warn');
  const before=b.type==='paragraph'?textOf(b):b.text;
  const after=(REWRITES[verb]||(t=>t))(before);
  aiPreview(`${verb} — ${before.length} → ${after.length} characters`,before,after,()=>{
    pushUndo('AI '+verb);
    if(b.type==='paragraph') b.runs=[{t:after,marks:[]}]; else b.text=after;
    paint(); toast(`Applied. ⌘Z removes the generated content entirely.`,'',4000,'ok');
  });
}
function aiDraftStep(){
  const s=step(), t=s.target;
  if(!t) return toast('Point this step at something first — the draft comes from the target’s accessible name and role.','',4400,'warn');
  const name=targetName(t), role=t.role||'button';
  const head=`${name}`;
  const body=`${draftCopyFor({name,role})} You can change this at any time from ${cap(t.route)}.`;
  aiPreview('Draft this step from the target',
    `${s.blocks.find(b=>b.type==='heading')?.text||''}\n${textOf(s.blocks.find(b=>b.type==='paragraph')||{})}`,
    `${head}\n${body}`,()=>{
      pushUndo('AI draft');
      const h=s.blocks.find(b=>b.type==='heading'); if(h) h.text=head;
      const p=s.blocks.find(b=>b.type==='paragraph'); if(p) p.runs=[{t:body,marks:[]}];
      paint(); toast('Drafted from the accessible tree — no page pixels were sent anywhere.','',4600,'ok');
    },`Built from the accessible name and role, not a screenshot. A target with a poor accessible name
       produces a poor draft — a quiet accessibility nudge.`);
}
function aiNarration(){
  const s=step();
  const spoken=s.blocks.filter(b=>b.type==='heading'||b.type==='paragraph')
    .map(b=>b.type==='heading'?b.text:textOf(b)).join(' ')
    .replace(/CSV/g,'C S V').replace(/\bUI\b/g,'interface');
  aiPreview('Write the spoken script',s.narration.script,spoken,()=>{
    pushUndo('AI narration'); s.narration.script=spoken; paint();
    toast('Spoken script written. It is a separate field — edit it for the ear, not the eye.','',4600,'ok');
  });
}
function aiAltText(){
  const b=selBlock()||step().blocks.find(x=>x.type==='media');
  if(!b) return toast('Select a media block first.','',2600,'warn');
  const alt='A Meridian workspace with four active projects and a progress column';
  aiPreview('Describe the image',b.alt||'(empty)',alt,()=>{
    pushUndo('AI alt text'); b.alt=alt; paint(); toast('Alt text written.','',3000,'ok');
  });
}
function aiPreview(title,before,after,accept,note){
  bigModal(title,
    `<div class="bd">${note||'Preview first. Nothing is applied until you accept.'}</div>
     <div class="diff"><span class="del">${esc(before||'(empty)')}</span>
       <span class="add">${esc(after)}</span></div>
     <div class="note i" style="margin-top:12px">AI may add content and styles. It may never edit your theme
       tokens or named styles — that guardrail is structural, not a policy.</div>`,
    [{n:'Reject',f:()=>closeBigModal()},
     {n:'Refine…',f:()=>{closeBigModal();openPalette(title)}},
     {n:'Accept',pri:true,f:()=>{accept();closeBigModal()}}]);
}
/* ── a small full-surface modal used by AI previews, reports and pickers ── */
let bigOpen=null;
function bigModal(title,body,actions){
  closeBigModal();
  const w=el('div');
  w.style.cssText='position:absolute;inset:0;z-index:105;background:rgba(6,8,14,.62);display:grid;place-items:center';
  const m=el('div');
  m.style.cssText=`width:min(720px,92vw);max-height:82vh;background:var(--c-menu);border:1px solid var(--c-menu-b);
    border-radius:14px;box-shadow:var(--c-shadow-r);display:flex;flex-direction:column;overflow:hidden;color:var(--c-ink)`;
  m.innerHTML=`<header style="display:flex;align-items:center;gap:10px;padding:14px 16px;
      border-bottom:1px solid var(--c-menu-b)">
      <b style="font-size:13.5px;letter-spacing:-.01em;flex:1">${title}</b>
      <button class="ix" data-x="1">${icon('x',13)}</button></header>
    <div style="padding:16px;overflow-y:auto;flex:1">${body}</div>
    ${actions?`<footer style="display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;
      border-top:1px solid var(--c-menu-b);background:#12151d">
      ${actions.map((a,i)=>`<button class="sbtn ${a.pri?'pri':''}" data-a="${i}">${a.n}</button>`).join('')}</footer>`:''}`;
  w.appendChild(m); $('#floats').appendChild(w); bigOpen=w;
  $$('[data-x]',m).forEach(b=>b.onclick=closeBigModal);
  w.onclick=e=>{ if(e.target===w) closeBigModal() };
  if(actions) $$('[data-a]',m).forEach(b=>b.onclick=()=>actions[+b.dataset.a].f());
  return m;
}
function closeBigModal(){ if(bigOpen){bigOpen.remove();bigOpen=null} }

  {n:'Open the flow map',s:'Operations',f:()=>openOps('map')},

  {n:'Run the Check report',s:'Operations',f:()=>openOps('check')},

];
const NL_EDITS=[
  {re:/short|brief|tight/i,label:'Shorten this step',run:()=>aiRewrite('Shorter')},
  {re:/friend|warm/i,label:'Make it friendlier',run:()=>aiRewrite('Friendlier')},
  {re:/formal|professional/i,label:'Make it more formal',run:()=>aiRewrite('More formal')},
  {re:/button|cta/i,label:'Add a button',run:()=>{pushUndo('AI add button');
    (actionsBlock()||{items:[]}).items.push({id:uid('a'),label:'Learn more',variant:'outline',
      size:'regular',action:'openPage',icon:'external-link',iconPlace:'end',width:'hug',widthPx:null});paint()}},
  {re:/video|media|image/i,label:'Add media',run:()=>insertBlock('video')},
  {re:/dim|spotlight/i,label:'Turn the spotlight on',run:()=>{step().spotlight.on=true;paint()}},

function openPalette(seed){
  closeMenu();
  const p=el('div'); p.id='palette';
  p.innerHTML=`<div class="pin">${icon('sparkle',18)}
      <input id="pal-in" placeholder="Ask Lodariq to change this step, or search commands…" value="${esc(seed||'')}">
      <kbd style="font:10px ui-monospace,Menlo,monospace;color:var(--c-subtle)">Esc</kbd></div>
    <div class="plist" id="pal-list"></div>`;
  $('#floats').appendChild(p);
  const inp=$('#pal-in',p), list=$('#pal-list',p);
  let sel=0;
  const render=()=>{
    const q=inp.value.trim();
    const nl=q.length>6?NL_EDITS.filter(n=>n.re.test(q)):[];
    const cmds=COMMANDS.filter(c=>!q||c.n.toLowerCase().includes(q.toLowerCase())||c.s.toLowerCase().includes(q.toLowerCase()));
    const rows=[...nl.map(n=>({n:n.label,s:'Proposed edit',f:n.run,ai:true})),...cmds];
    if(q&&!rows.length) rows.push({n:`Ask Lodariq: “${q}”`,s:'AI',ai:true,
      f:()=>aiPreview('Ask Lodariq',textOf(step().blocks.find(b=>b.type==='paragraph')||{}),
        `${q.charAt(0).toUpperCase()+q.slice(1)} — rewritten for this step.`,()=>{
          pushUndo('ask lodariq');
          const b=step().blocks.find(x=>x.type==='paragraph');
          if(b) b.runs=[{t:`${q.charAt(0).toUpperCase()+q.slice(1)} — rewritten for this step.`,marks:[]}];
          paint()})});
    list.innerHTML=rows.slice(0,10).map((r,i)=>`<div class="prow ${i===sel?'on':''}" data-c="${i}">
      ${icon(r.ai?'sparkle':'chevR',14)}<span>${esc(r.n)}</span><span class="sub">${esc(r.s)}</span></div>`).join('');
    $$('[data-c]',list).forEach(n=>n.onclick=()=>{const r=rows[+n.dataset.c];closePalette();r.f()});
    p._rows=rows;
  };
  render();
  inp.oninput=()=>{sel=0;render()};
  inp.onkeydown=e=>{
    if(e.key==='Escape'){closePalette();e.stopPropagation()}
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,(p._rows.length||1)-1);render();e.preventDefault()}
    if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);render();e.preventDefault()}
    if(e.key==='Enter'){const r=p._rows[sel];if(r){closePalette();r.f()}}
    e.stopPropagation();
  };
  inp.focus();
}
function closePalette(){ const p=$('#palette'); if(p) p.remove() }

/* ══════════════════════════════════════════════════════════════════════════
   PREVIEW (§4.7) + NARRATED AUTO-PLAY (wishlist 2.1)
   Every authoring pixel is removed. Exactly one survives.
   ══════════════════════════════════════════════════════════════════════════ */
let pvTimer=null, pvStart=0;
function enterPreview(narrated){
  S.preview={playing:!!narrated,t:0,narrated:!!narrated,captions:true};
  S.inspOpen=false; closeMenu();
  setMode('preview');
  announce('Preview started. The runtime renders with the exact theme snapshot that will publish.');
  if(step().target) ensureTargetPresent(step().target);
  applyZoom();
  drawPvBar(); paint();
  if(narrated) startNarration();
  toast(narrated?'Narrated demo — plays on your live product, so it cannot go stale.':'Preview — the exact runtime, the exact theme snapshot.','',3600);
}
function exitPreview(){
  clearInterval(pvTimer); pvTimer=null;
  S.preview.playing=false;
  $('#pvbar').style.display='none'; $('#capt').style.display='none';
  $('#appwin').style.transform=`scale(${S.canvasZoom})`;
  setMode('edit');
  announce('Preview ended.');
}
function applyZoom(){
  const s=step(), z=s.zoom;
  const win=$('#appwin');
  if(S.mode!=='preview'||!z?.on){ win.style.transform=`scale(${S.canvasZoom})`; win.style.transformOrigin='50% 50%'; return }
  const e=findTargetEl(s.target);
  if(!e){ win.style.transform='scale(1)'; return }
  const r=rectOf(e), R=stageRect();
  win.style.transformOrigin=`${((r.x+r.w/2)/R.width*100).toFixed(1)}% ${((r.y+r.h/2)/R.height*100).toFixed(1)}%`;
  win.style.transform=`scale(${z.scale})`;
  /* the target moves for the whole 550ms ease — the card has to travel with it */
  const t0=performance.now();
  const follow=()=>{ solve(); if(performance.now()-t0<650) requestAnimationFrame(follow) };
  requestAnimationFrame(follow);
}
function drawPvBar(){
  const b=$('#pvbar'); if(S.mode!=='preview'){b.style.display='none';return}
  b.style.display='flex';
  const R=stageRect();
  b.style.left=(R.width/2-b.offsetWidth/2||R.width/2-200)+'px';
  b.style.bottom=''; b.style.top=(R.height-56)+'px';
  const n=S.step+1, m=DOC.steps.length;
  const s=step(), dur=Math.max(2200,(s.narration.script.length||60)*46);
  b.innerHTML=`
    ${S.preview.narrated?`<button class="pbtn" id="pv-play">${icon(S.preview.playing?'pause':'play',14)}</button>`:''}
    <span style="white-space:nowrap"><b>Preview</b> · ${n} of ${m}</span>
    ${S.preview.narrated?`<div class="scrub" id="pv-scrub"><i style="width:${(S.preview.t/dur*100).toFixed(1)}%"></i>
      <b style="left:${(S.preview.t/dur*100).toFixed(1)}%"></b></div>
      <button class="pbtn" id="pv-cc" title="Captions">${icon('quote',13)}</button>`:''}
    <button class="pbtn" id="pv-prev" ${S.step===0?'disabled':''}>${icon('chevL',14)}</button>
    <button class="pbtn" id="pv-next" ${S.step===m-1?'disabled':''}>${icon('chevR',14)}</button>
    <button class="pbtn" id="pv-edit" title="⌘E">${icon('edit',13)}Edit this step</button>
    <button class="pbtn pri" id="pv-exit">Exit preview</button>`;
  on('pv-play','click',()=>{S.preview.playing=!S.preview.playing;
    if(S.preview.playing) startNarration(); else clearInterval(pvTimer); drawPvBar()});
  on('pv-cc','click',()=>{S.preview.captions=!S.preview.captions;
    $('#capt').style.display=S.preview.captions&&S.preview.narrated?'':'none'});
  on('pv-prev','click',()=>{S.step=Math.max(0,S.step-1);previewStepChanged()});
  on('pv-next','click',nextPreviewStep);
  on('pv-edit','click',()=>{ const keep=S.step; exitPreview(); S.step=keep; S.inspOpen=true; paint();
    toast('Step '+(keep+1)+' selected, preview state kept.','',3000) });
  on('pv-exit','click',exitPreview);
  on('pv-scrub','click',e=>{ const r=e.currentTarget.getBoundingClientRect();
    S.preview.t=((e.clientX-r.left)/r.width)*dur; drawPvBar() });
  const cap=$('#capt');
  if(S.preview.narrated&&S.preview.captions&&s.narration.script){
    cap.style.display=''; cap.textContent=s.narration.script;
    cap.style.left=(R.width/2)+'px'; cap.style.bottom='110px';
  } else cap.style.display='none';
}
function startNarration(){
  clearInterval(pvTimer);
  S.preview.t=0;
  const s=step(), dur=Math.max(2200,(s.narration.script.length||60)*46)+s.narration.offsetMs;
  pvTimer=setInterval(()=>{
    if(!S.preview.playing) return;
    S.preview.t+=100;
    if(S.preview.t>=dur){
      if(s.narration.autoAdvance&&S.step<DOC.steps.length-1) return nextPreviewStep();
      S.preview.playing=false; clearInterval(pvTimer);
    }
    drawPvBar();
  },100);
}
/* branching is evaluated for real against the test user */
/** wishlist 5.3 — skip a step whose lesson telemetry says they already know. */
function adaptiveSkipped(s){
  return DOC.adaptive.on && s.teaches && DOC.adaptive.demonstrated.includes(s.teaches);
}
function nextStepIndexFrom(i){
  const s=DOC.steps[i];
  const br=DOC.branches.find(b=>b.from===s.id&&evalCond(b.cond));
  if(br){ const t=stepIndex(br.to); if(t>=0) return t }
  if(s.transitions?.next?.type==='step'){ const t=stepIndex(s.transitions.next.stepId); if(t>=0) return t }
  if(s.transitions?.next?.type==='complete') return -1;
  let n=i+1;
  while(n<DOC.steps.length&&(!DOC.steps[n].conditions.every(evalCond)||adaptiveSkipped(DOC.steps[n]))) n++;
  return n<DOC.steps.length?n:-1;
}
function nextPreviewStep(){
  const cur=step();
  if(cur.continuesIn){
    const app=DOC.applications.find(a=>a.id===cur.continuesIn);
    toast(`Hands off to <b style="color:#fff">${esc(app?.name||'the other application')}</b>
      (${esc(app?.origin||'')}) — the journey resumes there with the same progress.`,'',6000,'ok');
    return exitPreview();
  }
  for(let k=S.step+1;k<DOC.steps.length;k++){
    if(adaptiveSkipped(DOC.steps[k]))
      toast(`Skipped “${esc(DOC.steps[k].title)}” — telemetry says they already use ${esc(DOC.steps[k].teaches)}.`,'',3600);
    else break;
  }
  const n=nextStepIndexFrom(S.step);
  if(n<0){ toast('Tour complete.','',2600,'ok'); return exitPreview() }
  const jumped=n!==S.step+1;
  S.step=n; previewStepChanged();
  if(jumped) toast(`Branched to step ${n+1} — ${esc(DOC.steps[n].title)}`,'',3000);
}
function previewStepChanged(){
  const t=step().target;
  if(t&&t.route!==APP.route){ APP.route=t.route; APP.side=(SIDE[t.route]||[['x']])[0][0]; renderApp() }
  else if(!t){ closeAppPop(); closeAppModal() }
  if(t&&ensureTargetPresent(t))
    toast('Reached “'+esc(targetName(t))+'” the recorded way.','',2600);
  paint(); playMotion(); applyZoom(); drawPvBar();
  if(S.preview.narrated&&S.preview.playing) startNarration();
}

/* ══════════════════════════════════════════════════════════════════════════
   PREDICTIVE LAYOUT QA (§7.3) — simulate before publish. Nobody ships this.
   ══════════════════════════════════════════════════════════════════════════ */
function qaFindings(){
  const out=[];
  DOC.steps.forEach((s,i)=>{
    L.qaViewports.forEach(vw=>{
      if(s.w>vw-32) out.push({step:i,vw,kind:'overflow',msg:`Card is ${s.w}px on a ${vw}px viewport`,
        fix:'Style'});
      if(vw<=768&&s.placement.side==='right'&&s.target)
        out.push({step:i,vw,kind:'flip',msg:'Placement flips to left at this width',fix:'Placement'});
    });
    if(s.target&&s.placement.offset<8&&s.w>420)
      out.push({step:i,vw:1280,kind:'occlude',msg:'Card may cover its own target',fix:'Placement'});
    const long=Math.round((s.blocks.filter(b=>b.type==='paragraph')
      .reduce((a,b)=>a+textOf(b).length,0))*1.34);
    if(long>260&&s.w<360) out.push({step:i,vw:1280,kind:'locale',
      msg:`Deutsch is ~34% longer (${long} chars) — text overflows`,fix:'Style'});
    const media=s.blocks.find(b=>b.type==='media');
    if(media&&!media.alt) out.push({step:i,vw:0,kind:'alt',msg:'Media has no alt text',fix:'Alt text'});
    (s.blocks.find(b=>b.type==='actions')?.items||[]).forEach(a=>{
      if(a.size==='compact'&&a.width==='hug'&&a.label.length<6)
        out.push({step:i,vw:375,kind:'tap',msg:`“${a.label}” is under ${G.tapMin}×${G.tapMin} CSS px`,fix:'Button'});
    });
    if(targetState(s.target)==='bad') out.push({step:i,vw:0,kind:'target',
      msg:'Target cannot be found — publish is blocked',fix:'Target'});
    if(targetState(s.target)==='ctx') out.push({step:i,vw:0,kind:'context',
      msg:'Target needs the recorded approach to resolve',fix:'Approach'});
  });
  /* contrast, computed for real */
  const th={...THEMES[DOC.activeTheme],...DOC.themeOverrides};
  const pairs=[['Body text on surface',th.body,th.surface],['Heading on surface',th.ink,th.surface],
    ['Button label on accent',th.onaccent,th.accent]];
  pairs.forEach(([n,a,b])=>{ const r=contrast(a,b);
    if(r<4.5) out.push({step:-1,vw:0,kind:'contrast',msg:`${n}: ${r.toFixed(2)}:1 — below AA`,fix:'Appearance'}) });
  DOC.locales.forEach(l=>{ if(l.pct<100) out.push({step:-1,vw:0,kind:'i18n',
    msg:`${l.name} is ${l.pct}% translated (${l.total-l.verified} steps unverified)`,fix:'Language'}) });
  return out;
}
function runPredictiveQA(inline){
  const f=qaFindings();
  const blocking=f.filter(x=>['target','contrast','alt'].includes(x.kind));
  bigModal('Predictive layout QA',
    `<div class="bd">Every step simulated against the captured target geometry at
      ${L.qaViewports.join(' / ')} px, in RTL, and with the longest available locale string.</div>
     <div class="cols c4" style="margin-bottom:14px">${L.qaViewports.map(vw=>{
       const s=step(), scale=190/vw, cw=Math.min(s.w,vw-24)*scale;
       const fail=s.w>vw-32;
       return `<div class="viewport-sim ${fail?'fail':''}" style="height:120px">
         <span class="vlbl">${vw}px${fail?' · overflow':''}</span>
         <div class="vtgt" style="left:14%;top:52%;width:26%;height:12%"></div>
         <div class="vcard" style="left:14%;top:${vw<768?'20%':'66%'};width:${Math.min(72,cw/190*100)}%;height:26%"></div>
       </div>`}).join('')}</div>
     <table class="dt"><thead><tr><th>Step</th><th>Viewport</th><th>Finding</th><th></th></tr></thead>
     <tbody>${f.length?f.map((x,i)=>`<tr><td class="k">${x.step<0?'Document':'Step '+(x.step+1)}</td>
       <td>${x.vw?x.vw+'px':'any'}</td>
       <td><span class="tag ${['target','contrast','alt'].includes(x.kind)?'b':'w'}">${x.kind}</span>
         ${esc(x.msg)}</td>
       <td style="text-align:right"><button class="sbtn sm" data-jump="${i}">Take me there</button></td></tr>`).join('')
       :`<tr><td colspan="4" style="color:var(--c-ok)">Nothing predicted to break.</td></tr>`}</tbody></table>
     <div class="note ${blocking.length?'b':'g'}" style="margin-top:13px">${blocking.length
       ? `${blocking.length} of these block publish. Save always works; publish does not.`
       : 'Nothing here blocks publish.'}</div>`,
    [{n:'Close',f:closeBigModal}]);
  $$('[data-jump]').forEach(n=>n.onclick=()=>{
    const x=f[+n.dataset.jump]; closeBigModal(); if(S.ops) closeOps();
    if(x.step>=0){ goStep(x.step); S.inspOpen=true;
      if(['Target','Approach','Evidence'].includes(x.fix)) S.sel={kind:'target',blockId:null,actionId:null};
      if(x.fix==='Alt text'){ const m=step().blocks.find(b=>b.type==='media'); if(m) selectBlock(m.id) }
      S.inspSection=x.fix.toLowerCase().replace(/[^a-z]/g,''); paint() }
    else openOps(x.fix==='Appearance'?'appearance':'language');
    toast(`Opened ${x.fix} for ${x.step<0?'the document':'step '+(x.step+1)}.`,'',2800);
  });
}
/* wishlist 5.2 — simulated user testing. Framed as a hint, never a verdict. */
function runSimulatedUser(){
  const notes=DOC.steps.map((s,i)=>{
    const words=s.blocks.filter(b=>b.type==='paragraph').reduce((a,b)=>a+textOf(b).split(' ').length,0);
    const acts=(s.blocks.find(b=>b.type==='actions')?.items||[]).length;
    const st=targetState(s.target);
    let verdict='followed it', why='Clear instruction, one obvious next move.', tone='ok';
    if(st==='bad'){verdict='gave up';why='Nothing on screen matched what the step described.';tone='b'}
    else if(acts>2){verdict='hesitated';why=`${acts} buttons — I did not know which one was the point.`;tone='w'}
    else if(words>34){verdict='skimmed';why=`${words} words is more than I read before clicking.`;tone='w'}
    else if(!s.target&&s.form==='modal'){verdict='dismissed it';why='A modal with no anchor felt like an ad.';tone='w'}
    return {i,verdict,why,tone,ms:900+words*90};
  });
  const trouble=notes.filter(n=>n.tone!=='ok');
  bigModal('Simulated first-time user',
    `<div class="bd">An agent instructed to behave like a confused first-time user walked the tour.
      Treat this as a hint about comprehension, never a verdict — it answers the question analytics
      cannot answer before launch.</div>
     <table class="dt"><thead><tr><th>Step</th><th>What it did</th><th>Why</th><th>Dwell</th></tr></thead>
     <tbody>${notes.map(n=>`<tr><td class="k">${n.i+1}. ${esc(DOC.steps[n.i].title)}</td>
       <td><span class="tag ${n.tone}">${n.verdict}</span></td><td>${esc(n.why)}</td>
       <td>${(n.ms/1000).toFixed(1)}s</td></tr>`).join('')}</tbody></table>
     <div class="note ${trouble.length?'w':'g'}" style="margin-top:13px">
       ${trouble.length?`${trouble.length} step${trouble.length>1?'s':''} lost it. The most common cause here is
         competing calls to action.`:'It got through without hesitating.'}</div>`,
    [{n:'Close',f:closeBigModal},
     {n:'Fix the first problem',pri:true,f:()=>{ closeBigModal();
       const t=trouble[0]; if(!t) return; goStep(t.i); S.inspOpen=true; paint() }}]);
}

  const port=(id,side)=>{ const p=MAP.pos[id]; return {x:p.x+(side==='out'?174:0),y:p.y+32} };
  DOC.steps.forEach((s,i)=>{
    const nx=DOC.steps[i+1];

      const a=port(s.id,'out'), b=port(nx.id,'in');
      path+=`<path class="medge" d="${curve(a,b)}"/>`;
    }
    if(s.transitions.next?.type==='step'){
      const t=stepById(s.transitions.next.stepId);
      if(t){ const a=port(s.id,'out'), b=port(t.id,'in');
        path+=`<path class="medge on" d="${curve(a,b)}"/>`;
        labels.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2-14,t:'always',id:null}) }
    }
  });

    const a=port(br.from,'out'), b=port(br.to,'in');

    labels.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2+22,t:br.label+(live?' ✓':''),id:br.id});
  });
  svg.innerHTML=path;

function curve(a,b,dip){
  const back=b.x<a.x;
  const dx=Math.max(46,Math.abs(b.x-a.x)/2);
  const off=dip?38:0;
  if(back){
    /* wrapping to the next row: drop below both rows instead of crossing them */
    const y=Math.max(a.y,b.y)+72+off;
    return `M${a.x},${a.y} C${a.x+70},${a.y} ${a.x+70},${y} ${a.x},${y} L${b.x},${y} C${b.x-70},${y} ${b.x-70},${b.y} ${b.x},${b.y}`;
  }
  return `M${a.x},${a.y} C${a.x+dx},${a.y+off} ${b.x-dx},${b.y+off} ${b.x},${b.y}`;
}
function startNodeDrag(e,node,id){

  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    node.classList.remove('dragging') };

}
function startConnect(e,fromId){

  const svg=$('#mapsvg'), wrap=$('#mapwrap').getBoundingClientRect();
  const a={x:MAP.pos[fromId].x+174,y:MAP.pos[fromId].y+32};

  tmp.setAttribute('class','medge on'); svg.appendChild(tmp);
  const mv=ev=>{ const b={x:(ev.clientX-wrap.left-MAP.pan.x)/MAP.zoom,y:(ev.clientY-wrap.top-MAP.pan.y)/MAP.zoom};
    tmp.setAttribute('d',curve(a,b)) };
  const up=ev=>{
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    tmp.remove();

    const h=s.blocks.find(b=>b.type==='heading'); if(h&&h.text!==n.textContent){pushUndo('storyboard edit');
      h.text=n.textContent; s.title=n.textContent.slice(0,28); markDirty()}});
  $$('[data-sbp]').forEach(n=>n.onblur=()=>{const s=DOC.steps[+n.dataset.sbp];
    const p=s.blocks.find(b=>b.type==='paragraph');
    if(p&&textOf(p)!==n.textContent){pushUndo('storyboard edit');p.runs=[{t:n.textContent,marks:[]}];markDirty()}});
  $$('[data-sb]').forEach(n=>{
    n.addEventListener('pointerdown',e=>{ if(e.target.isContentEditable||e.target.closest('button')) return;
      startSbDrag(e,n,+n.dataset.sb) });
  });
};
function startSbDrag(e,node,i){
  const sx=e.clientX, sy=e.clientY; let moved=false, to=i;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<7) return;
    moved=true; node.style.opacity='.4';
    const over=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-sb]');
    $$('[data-sb]').forEach(x=>x.style.outline='');
    if(over&&over!==node){ over.style.outline='2px solid var(--c-action)'; to=+over.dataset.sb }
  };
  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    node.style.opacity=''; $$('[data-sb]').forEach(x=>x.style.outline='');
    if(moved&&to!==i){ pushUndo('reorder steps'); const [s]=DOC.steps.splice(i,1); DOC.steps.splice(to,0,s);
      openOps('storyboard'); toast(`Moved “${s.title}” to position ${to+1}.`,
        `<button class="tb2" data-undo="1">Undo</button>`,4200) } };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

OPS_ACTIONS['sb:dupes']=()=>{
  const texts=DOC.steps.map(s=>textOf(s.blocks.find(b=>b.type==='paragraph')||{}).toLowerCase());
  const pairs=[];
  texts.forEach((a,i)=>texts.forEach((b,j)=>{ if(j<=i||!a||!b) return;
    const A=new Set(a.split(/\W+/).filter(w=>w.length>3)), B=new Set(b.split(/\W+/).filter(w=>w.length>3));
    const inter=[...A].filter(w=>B.has(w)).length, uni=new Set([...A,...B]).size;
    const sim=uni?inter/uni:0; if(sim>.16) pairs.push({i,j,sim}) }));
  bigModal('Repetition across steps',
    pairs.length?`<div class="bd">Steps that cover the same ground. Long tours fail because they repeat.</div>
     <table class="dt"><thead><tr><th>Pair</th><th>Overlap</th><th></th></tr></thead><tbody>
     ${pairs.sort((a,b)=>b.sim-a.sim).map(p=>`<tr>
       <td class="k">${p.i+1}. ${esc(DOC.steps[p.i].title)} &nbsp;↔&nbsp; ${p.j+1}. ${esc(DOC.steps[p.j].title)}</td>
       <td><div class="meter" style="width:110px"><i class="${p.sim>.3?'w':''}" style="width:${(p.sim*100).toFixed(0)}%"></i></div></td>
       <td style="text-align:right"><button class="sbtn sm" data-dupe="${p.i},${p.j}">Compare</button></td></tr>`).join('')}
     </tbody></table>`
     :`<div class="note g">No two steps overlap meaningfully. Nothing repeats.</div>`,
    [{n:'Close',f:closeBigModal}]);
  $$('[data-dupe]').forEach(n=>n.onclick=()=>{ const [i,j]=n.dataset.dupe.split(',').map(Number);
    S.multi=new Set([i,j]); closeBigModal(); OPS_ACTIONS['sb:side']() });
};

function runBrandSampler(){
  const probes=['body','primary nav','sticky header','first CTA button','first in-content link',
    'h1 / h2 / p','first card'];
  const m=bigModal('Making Lodariq look like your product…',
    `<div class="bd" id="samp-status">Sampling computed styles from a fixed semantic probe set…</div>
     <div id="samp-list">${probes.map((p,i)=>`<div class="evline" data-probe="${i}" style="opacity:.3">
       ${icon('search',13)}<span style="flex:1">${p}</span><span class="tag n" data-pv="${i}">…</span></div>`).join('')}</div>`);
  const found=['#f4f6f9 · 15.6px/1.5','#4f46e5 · 12.5px','#ffffff · 52px tall','#4f46e5 · r8 · 34×126',
    '#4f46e5 · underline','Inter 700/400 · 21/12.5px','#ffffff · r9 · 1px #e4e7ee'];
  let i=0;
  const t=setInterval(()=>{
    const row=$(`[data-probe="${i}"]`); if(!row){clearInterval(t);return}
    row.style.opacity='1'; $(`[data-pv="${i}"]`).textContent=found[i];
    $(`[data-pv="${i}"]`).className='tag ok';

/* ── 9. CHECK — pre-publish report, every row jumps to the fix ─────────── */
OPS_VIEW.check=()=>{
  const f=qaFindings();
  const blocking=f.filter(x=>['target','contrast','alt'].includes(x.kind));
  const groups={};
  f.forEach(x=>{ (groups[x.kind]=groups[x.kind]||[]).push(x) });
  const NAMES={overflow:'Card overflows the viewport',flip:'Placement flips to an unintended side',
    occlude:'Card occludes its own target',locale:'Text overflows at the longest locale',
    alt:'Missing alt text',tap:'Tap target under 44×44',target:'Target cannot be found',
    context:'Target needs its approach',contrast:'Contrast below AA',i18n:'Untranslated strings'};
  return `<div class="shead"><h2>${icon('shield',18)}Check</h2>
    <p>Everything that must be true before this can publish. Save almost always works; publish can be
      blocked. Each row carries a jump-to-element action — a passive list of problems gets ignored.</p></div>
  <div class="cols c4" style="margin-bottom:14px">
    ${[['Blocking',blocking.length,blocking.length?'b':'ok'],['Warnings',f.length-blocking.length,f.length-blocking.length?'w':'ok'],
      ['Steps',DOC.steps.length,'n'],['Locales',DOC.locales.length,'n']].map(([n,v,c])=>
      `<div class="box" style="margin:0"><div style="font-size:11px;color:var(--c-mut);margin-bottom:6px">${n}</div>
       <div style="font-size:24px;font-weight:700;letter-spacing:-.03em;color:${c==='b'?'var(--c-bad)':c==='w'?'var(--c-warn)':'var(--c-ink)'}">${v}</div></div>`).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <button class="sbtn" data-opsact="check:qa">${icon('ruler',13)}Predictive layout QA</button>
    <button class="sbtn" data-opsact="check:sim">${icon('bot',13)}Simulate a confused user</button>
    <button class="sbtn" data-opsact="check:a11y">${icon('a11y',13)}Accessibility sweep</button>
    <span style="flex:1"></span>
    <button class="sbtn ${blocking.length?'':'pri'}" data-opsact="check:publish" ${blocking.length?'disabled':''}>
      ${icon('rocket',13)}${blocking.length?`Publish blocked — ${blocking.length} to fix`:'Publish to staging'}</button>
  </div>
  ${Object.entries(groups).map(([k,items])=>`<div class="box"><h3>
      <span class="tag ${['target','contrast','alt'].includes(k)?'b':'w'}">${items.length}</span>${NAMES[k]||k}</h3>
    <ul class="lst">${items.map((x,i)=>`<li>
      <span>${x.step<0?'Document':`Step ${x.step+1} — ${esc(DOC.steps[x.step].title)}`}
        <div class="lm">${esc(x.msg)}${x.vw?` · at ${x.vw}px`:''}</div></span>
      <button class="sbtn sm" data-checkjump="${k}|${i}">Take me there</button></li>`).join('')}</ul></div>`).join('')
    ||`<div class="note g">Nothing to fix. Everything passes.</div>`}`;
};
OPS_BIND.check=()=>{
  const f=qaFindings(), groups={};
  f.forEach(x=>{(groups[x.kind]=groups[x.kind]||[]).push(x)});
  $$('[data-checkjump]').forEach(n=>n.onclick=()=>{
    const [k,i]=n.dataset.checkjump.split('|'); const x=groups[k][+i];
    closeOps();
    if(x.step>=0){ goStep(x.step); S.inspOpen=true;
      if(['Target','Approach','Evidence'].includes(x.fix)) S.sel={kind:'target',blockId:null,actionId:null};
      if(x.fix==='Alt text'){ const m=step().blocks.find(b=>b.type==='media'); if(m) selectBlock(m.id) }
      S.inspSection=x.fix.toLowerCase().replace(/[^a-z]/g,''); paint() }
    else openOps(x.fix==='Appearance'?'appearance':'language');
    toast(`Opened ${x.fix}${x.step>=0?` for step ${x.step+1}`:''}.`,'',2800);
  });
};

        :`<div class="bd">Nothing is shared yet.</div>`}
      <div class="note w" style="margin-top:12px">${icon('alert',12)} The open architectural question:

    <div class="box"><h3>${icon('palette',15)}Presentation</h3>

      <div class="fld"><label style="color:var(--c-mut);font-size:11.5px">Lodariq badge</label>
        <div class="v"><button class="pk" data-opsact="sh:badge">${DOC.limits.badge?'Shown':'Removed'}</button></div></div>
      <div class="fld"><label style="color:var(--c-mut);font-size:11.5px">Viewer can take over</label>

  </div>
  <div class="box"><h3>${icon('chart',15)}Demo views</h3>
    <table class="dt"><thead><tr><th>Viewer</th><th>Watched</th><th>Dropped at</th><th>When</th></tr></thead><tbody>
    ${S.demoLinkOn?[['acme.com (3 people)','92%','—','2h ago'],['northwind.io','44%','step 3','yesterday'],
      ['initech.dev','100%','—','3 days ago']].map(([a,b,c,d])=>`<tr><td class="k">${a}</td>
      <td><div style="display:flex;align-items:center;gap:9px"><div class="meter" style="width:80px">
        <i class="${parseInt(b)>80?'ok':'w'}" style="width:${b}"></i></div>${b}</div></td>
      <td>${c}</td><td>${d}</td></tr>`).join('')
