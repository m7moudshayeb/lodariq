    </tbody></table></div>`;
OPS_ACTIONS['sh:toggle']=()=>{S.demoLinkOn=!S.demoLinkOn;openOps('share');
  toast(S.demoLinkOn?'Public demo link created. It plays on your live product, so it can never go stale.':'Link disabled.','',4200,'ok')};
OPS_ACTIONS['sh:copy']=()=>toast('Link copied.','',2200,'ok');

/* ══════════════════════════════════════════════════════════════════════════
   EXPERIENCE TYPES (§5) — the model is type-agnostic by construction.
   Each type composes capabilities, seeds content and answers gestures.
   Mirrors packages/sdk-authoring/src/authoring/experiences/built-in.ts
   ══════════════════════════════════════════════════════════════════════════ */
const EXPERIENCES={
  tour:{name:'Tour',icon:'map',workspace:'sequence',
    gestures:['pick-target','drag-anchor','resize','reorder'],
    sections:['Style','Actions','Placement','Target','Narration','Advanced'],
    note:'The implemented case. Sequence, targets, branches.'},
  announcement:{name:'Announcement',icon:'bell',workspace:'singleSurface',
    gestures:['drag-to-region','resize'],
    sections:['Style','Dismissal','Frequency','Audience','Advanced'],
    note:'Drop one card centre-screen. Dragging it to an edge is choosing slide-in; the top edge is a banner. The form is a consequence of position.'},
  hotspot:{name:'Hotspot',icon:'spot',workspace:'singleSurface',
    gestures:['pick-target','drag-marker','pick-marker-form'],
    sections:['Marker','Tooltip','Trigger','Style','Advanced'],
    note:'Marker and tooltip are one object in two states.'},
  survey:{name:'Survey',icon:'form',workspace:'collection',
    gestures:['reorder-items','resize'],
    sections:['Question','Options','Logic','Style','Advanced'],
    note:'One CSAT question on the canvas immediately. The template picker is a link inside the first section, never a grid you face before seeing anything.'},
  checklist:{name:'Checklist',icon:'check',workspace:'collection',
    gestures:['drag-to-region','reorder-items'],
    sections:['Items','Completion','Style','Advanced'],
    note:'Same edge-drag logic as announcements: an edge is a drawer, the middle floats.'}
};
function switchExperience(type){
  if(type===DOC.type) return;
  pushUndo('experience type');
  DOC.type=type;
  const E=EXPERIENCES[type];
  if(type!=='tour'){
    /* single-surface and collection types collapse to one authorable surface */
    const s=DOC.steps[S.step];
    if(type==='announcement'){ s.target=null; s.region='center'; s.form='modal' }
    if(type==='checklist'){ s.target=null; s.region='right'; s.form='drawer';
      if(!s.blocks.some(b=>b.type==='list')) s.blocks.splice(1,0,blk('list',{ordered:false,
        items:['Create your first project','Import your data','Invite two teammates','Publish a report']})) }
    if(type==='survey'){ s.target=null; s.region='bottom-right'; s.form='floating';
      if(!s.blocks.some(b=>b.type==='formField')) s.blocks.splice(1,0,blk('formField',{control:'radio',
        label:'How easy was that?',required:true,size:'regular',radius:'theme',
        options:['Very hard','Hard','Neutral','Easy','Very easy']})) }
    if(type==='hotspot'){ s.region=null; s.form='tooltip'; s.w=Math.min(s.w,300) }
  }
  S.multi.clear(); paint();
  toast(`Now authoring a <b style="color:#fff">${E.name}</b>. ${E.note}`,'',6000,'ok');
}

/* ══════════════════════════════════════════════════════════════════════════
   GLOBAL WIRING
   ══════════════════════════════════════════════════════════════════════════ */
function installGlobalEvents(){
  /* click on the card background selects the card; drag moves it */
  $('#card').addEventListener('pointerdown',e=>{
    if(S.mode!=='edit') return;
    if(e.target.closest('[data-blk]')||e.target.closest('.rz')) return;
    selectCard(); startCardDrag(e);
  });
  $('#frame').addEventListener('pointerdown',e=>{ if(S.mode==='edit'){selectCard();startCardDrag(e)} });

  /* dismiss transient surfaces */
  document.addEventListener('pointerdown',e=>{
    if(openMenu&&!openMenu.contains(e.target)&&!e.target.closest('.tb,.pk,.pbtn,.sbtn,.gh,[data-opsact],[data-m],[data-i]'))
      closeMenu();
    if(APP.pop&&!APP.pop.contains(e.target)&&!e.target.closest('[data-pop]')&&S.mode!=='picking') closeAppPop();
    if($('#palette')&&!$('#palette').contains(e.target)) closePalette();
    if(hoverNode&&PICK.pinned&&!hoverNode.contains(e.target)&&S.mode==='picking') {PICK.pinned=false;killHover()}
  },true);

  /* keyboard: accelerators only. Every one duplicates a visible control. */
  document.addEventListener('keydown',e=>{
    const typing=e.target.isContentEditable||/input|textarea|select/i.test(e.target.tagName);
    const M=e.metaKey||e.ctrlKey;
    if(e.key==='Escape'){
      if($('#palette')) return closePalette();
      if(bigOpen) return closeBigModal();
      if(openMenu) return closeMenu();
      if(S.mode==='picking') return exitPicker(true);
      if(S.ops) return closeOps();
      if(S.mode==='preview') return exitPreview();
      if(S.inspOpen){ S.inspOpen=false; return paint() }
      if(APP.modal) return closeAppModal();
      return;
    }
    if(M&&e.key.toLowerCase()==='k'){e.preventDefault();return openPalette('')}
    if(M&&e.key==='/'){e.preventDefault();S.inspOpen=!S.inspOpen;return paint()}
    if(M&&e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();return redo()}
    if(M&&e.key.toLowerCase()==='z'){e.preventDefault();return undo()}
    if(M&&e.altKey&&e.key.toLowerCase()==='c'){e.preventDefault();return styleAction('copy')}
    if(M&&e.altKey&&e.key.toLowerCase()==='v'){e.preventDefault();return styleAction('paste')}
    if(M&&e.shiftKey&&e.key==='\\'){e.preventDefault();S.hideChrome=!S.hideChrome;return paint()}
    if(M&&e.key.toLowerCase()==='e'&&S.mode==='preview'){e.preventDefault();
      const k=S.step; exitPreview(); S.step=k; S.inspOpen=true; return paint()}
    if(typing) return;
    if(e.key===' '&&S.mode==='edit'&&!e.repeat){ e.preventDefault();
      document.body.classList.add('peeking'); return }
    if(e.key.toLowerCase()==='p'&&!M){ e.preventDefault(); return S.mode==='preview'?exitPreview():enterPreview(false) }
    if(e.key==='ArrowLeft'&&S.mode!=='picking'){ e.preventDefault();
      return S.mode==='preview'?(S.step=Math.max(0,S.step-1),previewStepChanged()):goStep(S.step-1) }
    if(e.key==='ArrowRight'&&S.mode!=='picking'){ e.preventDefault();
      return S.mode==='preview'?nextPreviewStep():goStep(S.step+1) }
    if(S.mode==='picking'){
      if(e.key==='ArrowUp'){e.preventDefault();PICK.idx=Math.max(0,PICK.idx-1);
        paintHilite(PICK.path[PICK.idx].n);drawBands()}
      if(e.key==='ArrowDown'){e.preventDefault();PICK.idx=Math.min(PICK.path.length-1,PICK.idx+1);
        paintHilite(PICK.path[PICK.idx].n);drawBands()}
      if(e.key==='Enter'){e.preventDefault();commitTarget(PICK.path[PICK.idx]?.n)}
    }
  });
  document.addEventListener('keyup',e=>{
    if(e.key===' ') document.body.classList.remove('peeking');
  });
  window.addEventListener('resize',()=>{ requestAnimationFrame(()=>{solve();drawPulses();drawPvBar()}) });
  window.addEventListener('blur',()=>document.body.classList.remove('peeking'));
  $('#showchip').innerHTML=`${icon('eye',14)}<span>Show Lodariq</span>`;
  $('#showchip').onclick=()=>{S.hideChrome=false;paint()};
  document.addEventListener('mousemove',resetIdle);
  document.addEventListener('click',resetIdle);
}

/* the pill menu gains the experience-type switcher */
const _pillMenu=pillMenu;
pillMenu=function(btn){
  menu(btn,`
    <div class="mh">Experience type</div>
    ${optList(Object.entries(EXPERIENCES).map(([k,e])=>({v:'x:'+k,n:e.name,i:e.icon})),'x:'+DOC.type)}
    <div class="msep"></div><div class="mh">Operations</div>
    ${optList([{v:'ops',n:'Open Operations',i:'layers'},{v:'map',n:'Flow map',i:'map'},
      {v:'story',n:'Storyboard',i:'columns'},{v:'check',n:'Run the Check report',i:'shield'},
      {v:'release',n:'Release & review',i:'rocket'}])}
    <div class="msep"></div><div class="mh">Play</div>
    ${optList([{v:'preview',n:'Preview as a user',i:'eye',k:'P'},
      {v:'narrated',n:'Narrated demo — auto-play',i:'volume'},
      {v:'record',n:S.recording?'Stop recording steps':'Record steps from my clicks',i:'crosshair'},
      {v:'sim',n:'Simulate a confused first-time user',i:'bot'}])}
    <div class="msep"></div><div class="mh">Environment</div>
    ${optList([{v:'env:Dev',n:'Dev'},{v:'env:Staging',n:'Staging'},
      {v:'env:Production',n:'Production — blocked from the SDK'}],'env:'+DOC.env)}
    <div class="msep"></div>
    ${optList([{v:'hide',n:S.hideChrome?'Show all panels':'Hide all panels',i:'eye',k:'⌘⇧\\'},
      {v:'zoomin',n:'Zoom the canvas in',i:'zoomIn'},{v:'zoomout',n:'Zoom the canvas out',i:'zoomOut'},
      {v:'zoomreset',n:'Reset canvas zoom',i:'refresh'},
      {v:'keys',n:'Keyboard map',i:'help'},{v:'restart',n:'Restart the demo',i:'refresh'},
      {v:'exit',n:'Exit authoring',i:'external'}])}`,
    {alignRight:true,onPick:v=>{
      if(v.startsWith('x:')) return switchExperience(v.slice(2));
      if(v.startsWith('env:')){ const e=v.slice(4);
        if(e==='Production') return toast('Production is rejected at every layer. Promote a verified staging artifact from Operations → Release.','',5200,'warn');
        DOC.env=e; drawPill(); return toast(`Environment: ${e}`,'',2000) }
      ({ops:()=>openOps('map'),map:()=>openOps('map'),story:()=>openOps('storyboard'),
        check:()=>openOps('check'),release:()=>openOps('release'),
        preview:()=>enterPreview(false),narrated:()=>enterPreview(true),
        record:()=>toggleRecording(),sim:()=>runSimulatedUser(),
        hide:()=>{S.hideChrome=!S.hideChrome;paint()},
        zoomin:()=>setCanvasZoom(S.canvasZoom+.15),zoomout:()=>setCanvasZoom(S.canvasZoom-.15),
        zoomreset:()=>setCanvasZoom(1),keys:()=>keyboardMap(),restart:()=>restartDemo(),
        exit:()=>toast('In the real SDK this closes the authoring frame and returns your product to normal.','',4200)
      })[v]?.();
    }});
};

/* ══════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════ */
function boot(){
  DOC.seenThemeVersion=DOC.themeVersion;
  applyTheme(DOC.activeTheme,DOC.themeOverrides);
  renderApp();
  installPickerEvents();
  installGlobalEvents();
  S.livecursors=false;
  paint();
  setTimeout(()=>{
    toast(`<b style="color:#fff">Lodariq is open on your product.</b> Drag what you can see, open the
      inspector for what you selected, open Operations for the whole thing.`,
      `<button class="tb2" data-tour="1">Show me</button>`,9000);
    setTimeout(()=>$$('[data-tour]').forEach(b=>b.onclick=()=>{
      b.closest('.toast').remove(); firstRun() }),20);
  },700);
  /* a theme changed elsewhere while this session was open (§6.3) */
  setTimeout(()=>{ DOC.themeVersion=4;
    if(S.ops==='appearance') openOps('appearance');
    toast('Theme updated by Maya Haddad — this session holds the older snapshot.',
      `<button class="tb2" data-reload="1">Reload</button>`,9000,'warn');
    setTimeout(()=>$$('[data-reload]').forEach(b=>b.onclick=()=>{
      DOC.seenThemeVersion=4; b.closest('.toast').remove();
      toast('Reloaded with the current theme snapshot. No session restart needed.','',3600,'ok') }),20);
  },42000);
}
function firstRun(){
  const beats=[
    ()=>{ selectBlock(step().blocks[1].id);
      toast('<b style="color:#fff">Tier 1 — manipulate.</b> Drag the compass on the target, drag the card, drag the 8 handles to resize, drag the gutter handle to reorder a block.','',6500) },
    ()=>{ S.inspOpen=true; paint();
      toast('<b style="color:#fff">Tier 2 — inspect.</b> One popover, sections not tabs, chosen by what you selected.','',6000) },
    ()=>{ S.inspOpen=false; goStep(1); paint();
      toast('<b style="color:#fff">Targeting.</b> Step 2 points at “Create project”. Try <b>Change target</b> — or open the Import menu while picking and watch the page freeze itself.','',7000) },
    ()=>{ toast('<b style="color:#fff">Tier 3 — operate.</b> The ⌄ menu on the pill opens Operations: flow map, storyboard, appearance, language, A/B, Check, release.','',7000) }
  ];
  beats.forEach((f,i)=>setTimeout(f,i*4200));
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
</script>
