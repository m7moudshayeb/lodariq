<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lodariq Authoring SDK — working prototype</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   LODARIQ AUTHORING SDK — full working prototype
   Single file, zero dependencies.

   Three token sets, deliberately never mixed (§4.2a rule 8):
     --app-*   the customer's product (Meridian) — the canvas
     --b-*     the customer's BRAND THEME — the card publishes in these
     --c-*     Lodariq CREATOR CHROME — restrained glass, Editorial Air
   Values mirror packages/sdk-authoring/src/creator-chrome-tokens.ts exactly.
   ══════════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── CREATOR CHROME (CREATOR_CHROME_TOKENS) ── */
  --c-action:#7c8cff; --c-action-h:#96a3ff; --c-onaction:#0b0d11;
  --c-border:#313642; --c-canvas:#14161c; --c-chrome:#14161c; --c-surface:#1e212a;
  --c-focus:#7c8cff; --c-ink:#e7e9ee; --c-mut:#98a0b0; --c-inksoft:#c6cbd3;
  --c-subtle:#7a828d; --c-surface-s:#26292f; --c-border-s:#26292f;
  /* glass (CREATOR_CHROME_GLASS) */
  --c-glass:rgba(20,22,28,.94); --c-blur:blur(14px);
  --c-shadow:0 8px 24px -6px rgba(0,0,0,.55);
  --c-shadow-r:0 18px 44px -10px rgba(0,0,0,.65);
  --c-shadow-dot:0 1px 4px rgba(0,0,0,.35);
  /* on-glass controls (CREATOR_CHROME_CONTROL_TOKENS) */
  --c-ctl:#242935; --c-ctl-h:#333a49; --c-ctl-b:#333a48; --c-quiet:#272c37;
  --c-menu:#1a1e28; --c-menu-b:#2b3140;
  /* status (CREATOR_CHROME_STATUS_TOKENS) */
  --c-warn:#f5a524; --c-bad:#f2555a; --c-ok:#3ecf8e; --c-peer:#0f9b6c;
  /* geometry (OVERLAY_CHROME_GEOMETRY) */
  --c-r-tb:10px; --c-r-ctl:6px; --c-r-insp:12px;
  /* motion (OVERLAY_CHROME_MOTION) */
  --t-move:200ms; --t-ease:cubic-bezier(.2,.8,.2,1); --t-avoid:150ms; --t-fade:180ms;
  --c-font:Inter,"Plus Jakarta Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  /* ── CUSTOMER PRODUCT (Meridian) ── */
  --app-bg:#f4f6f9; --app-surface:#fff; --app-line:#e4e7ee; --app-line2:#eef0f5;
  --app-ink:#0f1729; --app-ink2:#344054; --app-mut:#667085; --app-brand:#4f46e5;
  --app-brand-soft:#eef2ff; --app-ok:#067647; --app-ok-bg:#ecfdf3;
  --app-warn:#b54708; --app-warn-bg:#fffaeb; --app-bad:#b42318; --app-bad-bg:#fef3f2;
  --app-r:9px;

  /* ── CUSTOMER BRAND THEME — swapped live by §7.1 generation ── */
  --b-surface:#ffffff; --b-ink:#1a1633; --b-body:#4a4360; --b-accent:#6d3bf5;
  --b-onaccent:#ffffff; --b-border:#e9e4f7; --b-radius:14px;
  --b-shadow:0 12px 32px -8px rgba(45,20,120,.28);
  --b-pad:18px; --b-bw:1px; --b-font:inherit; --b-fs:13px; --b-lh:1.55;
  --b-h-fs:15px; --b-h-w:700; --b-btn-r:8px; --b-gap:9px;
  --b-backdrop:rgba(12,10,24,.42);
}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 var(--c-font);background:var(--app-bg);color:var(--app-ink);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3a4050;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.app-scroll::-webkit-scrollbar-thumb{background:#c9cfda;border:2px solid transparent;background-clip:padding-box}

/* ══════════════════════════════════════════════════════════════════════════
   THE CUSTOMER PRODUCT — Meridian
   A dense, realistic SaaS so there are real targets, real lists, real
   transient layers (menus, modals, popovers) and real navigation.
   ══════════════════════════════════════════════════════════════════════════ */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--app-bg)}
#appwin{position:absolute;inset:0;display:flex;flex-direction:column;
  transform-origin:50% 50%;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.a-top{height:52px;background:var(--app-surface);border-bottom:1px solid var(--app-line);
  display:flex;align-items:center;gap:22px;padding:0 18px;flex:none;position:relative;z-index:3}
.a-logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:-.02em}
.a-logo .mk{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#4f46e5);
  display:grid;place-items:center;color:#fff}
.a-nav{display:flex;gap:3px}
.a-nav button{background:none;border:none;padding:7px 11px;border-radius:7px;font-size:13px;
  color:var(--app-mut);cursor:pointer;font-weight:500}
.a-nav button:hover{background:#f4f5f8;color:var(--app-ink)}
.a-nav button.on{background:var(--app-brand-soft);color:var(--app-brand);font-weight:600}
.a-top .sp{flex:1}
.a-search{display:flex;align-items:center;gap:7px;background:#f6f7fa;border:1px solid var(--app-line);
  border-radius:8px;padding:6px 11px;width:216px;color:var(--app-mut);font-size:12.5px;cursor:text}
.a-icobtn{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;
  display:grid;place-items:center;color:var(--app-mut);cursor:pointer;position:relative}
.a-icobtn:hover{background:#f4f5f8;color:var(--app-ink)}
.a-icobtn .bdg{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
  background:#f04438;border:1.5px solid #fff}
.a-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#a5b4fc,#6366f1);
  color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;cursor:pointer;
  border:none;flex:none}
.a-body{display:flex;flex:1;min-height:0}
.a-side{width:196px;border-right:1px solid var(--app-line);background:var(--app-surface);
  padding:14px 10px;flex:none;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.a-side .grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#98a2b3;
  padding:14px 9px 6px;font-weight:700}
.a-side .grp:first-child{padding-top:2px}
.a-side button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
  padding:7px 9px;border-radius:7px;color:var(--app-ink2);font-size:12.5px;cursor:pointer;text-align:left}
.a-side button:hover{background:#f5f6f9}
.a-side button.on{background:var(--app-brand-soft);color:var(--app-brand);font-weight:600}
.a-side button .ct{margin-left:auto;font-size:10.5px;color:#98a2b3;background:#f2f4f7;
  padding:1px 6px;border-radius:10px;font-weight:600}
.a-side button.on .ct{background:#e0e7ff;color:var(--app-brand)}
.a-main{flex:1;padding:22px 26px 40px;overflow-y:auto;min-width:0}
.a-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.a-head h1{font-size:21px;letter-spacing:-.025em;font-weight:700;margin-bottom:3px}
.a-head .sub{color:var(--app-mut);font-size:12.5px}
.a-actions{display:flex;gap:8px;flex:none}
.a-btn{padding:8px 13px;border:1px solid var(--app-line);border-radius:8px;background:#fff;
  font-size:12.5px;color:var(--app-ink);cursor:pointer;font-weight:500;display:flex;
  align-items:center;gap:7px;white-space:nowrap}
.a-btn:hover{background:#f8f9fb;border-color:#d6dae3}
.a-btn.pri{background:var(--app-brand);border-color:var(--app-brand);color:#fff;font-weight:600}
.a-btn.pri:hover{background:#4338ca;border-color:#4338ca}
.a-btn.sm{padding:5px 9px;font-size:11.5px}
.a-btn.danger{color:var(--app-bad);border-color:#fecdca}
.a-btn:disabled{opacity:.5;cursor:not-allowed}

.a-grid{display:grid;gap:14px;margin-bottom:18px}
.a-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.a-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.a-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.a-card{background:var(--app-surface);border:1px solid var(--app-line);border-radius:var(--app-r);
  padding:15px 16px}
.a-card h3{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.a-card .lbl{font-size:11.5px;color:var(--app-mut);margin-bottom:8px}
.a-stat{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.a-delta{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-top:5px}
.a-delta.up{color:var(--app-ok)} .a-delta.down{color:var(--app-bad)}
.a-spark{height:34px;width:100%;margin-top:9px;display:block}

.a-tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--app-line);
  border-radius:var(--app-r);overflow:hidden;font-size:12.5px}
.a-tbl thead th{text-align:left;padding:9px 13px;background:#fafbfc;color:var(--app-mut);
  font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--app-line);white-space:nowrap}
.a-tbl td{padding:11px 13px;border-bottom:1px solid var(--app-line2);color:var(--app-ink2);
  vertical-align:middle}
.a-tbl tbody tr:last-child td{border-bottom:none}
.a-tbl tbody tr:hover{background:#fafbfd}
.a-tbl td.nm{color:var(--app-ink);font-weight:600}
.a-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
  font-size:10.5px;font-weight:600;white-space:nowrap}
.a-chip.ok{background:var(--app-ok-bg);color:var(--app-ok)}
.a-chip.warn{background:var(--app-warn-bg);color:var(--app-warn)}
.a-chip.bad{background:var(--app-bad-bg);color:var(--app-bad)}
.a-chip.mut{background:#f2f4f7;color:#475467}
.a-chip .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.a-people{display:flex;align-items:center;gap:8px}
.a-face{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:9.5px;font-weight:700;flex:none}
.a-bar{display:flex;gap:9px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.a-seg{display:flex;background:#f2f4f7;border-radius:8px;padding:2px;gap:2px}
.a-seg button{border:none;background:none;padding:5px 11px;border-radius:6px;font-size:12px;
  color:var(--app-mut);cursor:pointer;font-weight:500}
.a-seg button.on{background:#fff;color:var(--app-ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.a-prog{height:6px;background:#eef0f5;border-radius:4px;overflow:hidden;margin-top:7px}
.a-prog i{display:block;height:100%;border-radius:4px;background:var(--app-brand)}
.a-empty{text-align:center;padding:56px 20px;color:var(--app-mut)}
.a-empty .ic{width:44px;height:44px;border-radius:12px;background:#f2f4f7;display:grid;
  place-items:center;margin:0 auto 12px;color:#98a2b3}
.a-empty h3{font-size:14px;color:var(--app-ink);margin-bottom:5px}
.a-empty p{font-size:12.5px;max-width:38ch;margin:0 auto 14px;line-height:1.6}
.a-field{margin-bottom:14px}
.a-field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--app-ink2)}
.a-field input,.a-field select,.a-field textarea{width:100%;padding:8px 11px;border:1px solid var(--app-line);
  border-radius:8px;font-size:12.5px;background:#fff}
.a-field .hint{font-size:11.5px;color:var(--app-mut);margin-top:4px}
.a-toggle{width:38px;height:22px;border-radius:12px;background:#e4e7ec;position:relative;
  cursor:pointer;border:none;flex:none;transition:background .16s}
.a-toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2);transition:left .16s}
.a-toggle.on{background:var(--app-brand)} .a-toggle.on i{left:18px}
.a-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;
  border-bottom:1px solid var(--app-line2)}
.a-row:last-child{border-bottom:none}
.a-row .t{font-size:12.5px;font-weight:600} .a-row .d{font-size:11.5px;color:var(--app-mut);margin-top:2px}
.a-tabs{display:flex;gap:2px;border-bottom:1px solid var(--app-line);margin-bottom:18px}
.a-tabs button{background:none;border:none;padding:9px 13px;font-size:12.5px;color:var(--app-mut);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.a-tabs button.on{color:var(--app-brand);border-bottom-color:var(--app-brand);font-weight:600}

/* transient app layers — menus, modals, popovers. Real targets for §4.4a. */
.a-pop{position:absolute;background:#fff;border:1px solid var(--app-line);border-radius:10px;
  box-shadow:0 14px 38px -10px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.06);
  z-index:40;min-width:210px;padding:6px;font-size:12.5px}
.a-pop .hd{padding:8px 10px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:#98a2b3;font-weight:700}
.a-pop button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
  padding:7px 10px;border-radius:7px;color:var(--app-ink2);cursor:pointer;text-align:left;font-size:12.5px}
.a-pop button:hover{background:#f5f6f9;color:var(--app-ink)}
.a-pop button.danger{color:var(--app-bad)}
.a-pop .sep{height:1px;background:var(--app-line2);margin:5px 0}
.a-pop .note{padding:7px 10px;font-size:11.5px;color:var(--app-mut);line-height:1.5}
.a-modal-bg{position:absolute;inset:0;background:rgba(16,24,40,.45);z-index:39;
  backdrop-filter:blur(1.5px);animation:fadein .16s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.a-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;
  border-radius:14px;box-shadow:0 26px 62px -12px rgba(16,24,40,.4);z-index:40;width:min(520px,86vw);
  overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.a-modal .mh{padding:17px 20px 13px;border-bottom:1px solid var(--app-line);display:flex;
  align-items:flex-start;justify-content:space-between;gap:14px}
.a-modal .mh h2{font-size:15.5px;letter-spacing:-.02em}
.a-modal .mh p{font-size:12.5px;color:var(--app-mut);margin-top:3px}
.a-modal .mb{padding:18px 20px;max-height:52vh;overflow-y:auto}
.a-modal .mf{padding:13px 20px;border-top:1px solid var(--app-line);display:flex;
  justify-content:flex-end;gap:9px;background:#fafbfc}
.a-x{width:28px;height:28px;border-radius:7px;border:none;background:none;color:var(--app-mut);
  cursor:pointer;display:grid;place-items:center;flex:none}
.a-x:hover{background:#f2f4f7;color:var(--app-ink)}
.a-drop{position:relative}
.a-toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#101828;
  color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;z-index:41;display:flex;
  align-items:center;gap:11px;box-shadow:0 14px 34px -10px rgba(0,0,0,.4)}
.a-file{border:1.5px dashed var(--app-line);border-radius:10px;padding:26px;text-align:center;
  color:var(--app-mut);font-size:12.5px;background:#fafbfc}
.a-kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.a-col{background:#f7f8fa;border:1px solid var(--app-line2);border-radius:10px;padding:10px;min-height:180px}
.a-col .ch{font-size:11.5px;font-weight:700;color:var(--app-ink2);display:flex;align-items:center;
  justify-content:space-between;margin-bottom:9px;padding:0 3px}
.a-ticket{background:#fff;border:1px solid var(--app-line);border-radius:8px;padding:10px;
  margin-bottom:8px;font-size:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.a-ticket .tt{font-weight:600;color:var(--app-ink);margin-bottom:6px;line-height:1.4}
.a-ticket .mt{display:flex;align-items:center;gap:7px;color:var(--app-mut);font-size:10.5px}
</style>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   LODARIQ LAYER — everything below is drawn by the SDK, never by the product.
   §3.4: exactly one module owns z-order. The ladder is declared here once.
     20 spotlight backdrop   30 ring/pulses   40 compass   50 card+frame
     60 toolbar              70 inspector     80 pill/filmstrip
     90 bands/pickers        100 sheets       110 toasts/palette
   ══════════════════════════════════════════════════════════════════════════ */
.lq{font-family:var(--c-font)}
#lqlayer{position:absolute;inset:0;pointer-events:none;z-index:10}
#lqlayer>*{pointer-events:auto}
/* Browsing (§3.3): the layer ghosts, clicks reach the product. */
body.browsing #lqlayer>*:not(#pill):not(#toasts):not(#showchip):not(#floats):not(#sheetwrap){
  opacity:.15;pointer-events:none;filter:saturate(.25)}
body.peeking  #lqlayer>*:not(#pill):not(#toasts):not(#floats):not(#sheetwrap){opacity:.12;pointer-events:none}
body.hidechrome #lqlayer>*:not(#showchip):not(#toasts){display:none}
body.previewing #lqlayer>.author-only{display:none!important}
body.picking #lqlayer>.pick-hide{display:none!important}
body.picking #appwin{cursor:crosshair}
body.picking .a-btn,body.picking button,body.picking a{cursor:crosshair!important}
#lqlayer>*{transition:opacity var(--t-fade) ease,filter var(--t-fade) ease}

/* ── target ring + pulses (§4.4) ────────────────────────────────────── */
#ring{position:absolute;pointer-events:none;z-index:30;border-radius:8px;
  transition:all var(--t-move) var(--t-ease)}
#ring[data-state=ok]{border:var(--ring-w,2px) var(--ring-style,solid) var(--ring-c,var(--b-accent));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ring-c,var(--b-accent)) 16%,transparent)}
#ring[data-state=ctx]{border:2px dashed var(--c-warn);box-shadow:0 0 0 3px rgba(245,165,36,.14)}
#ring[data-state=bad]{border:2px solid var(--c-bad);box-shadow:0 0 0 3px rgba(242,85,90,.16)}
#ring.glow{box-shadow:0 0 0 3px color-mix(in srgb,var(--ring-c,var(--b-accent)) 20%,transparent),
  0 0 22px 2px color-mix(in srgb,var(--ring-c,var(--b-accent)) 45%,transparent)}
#ring.pulse{animation:ringpulse 1.9s ease-out infinite}
@keyframes ringpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ring-c,var(--b-accent)) 55%,transparent)}
  70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pulse-dot{position:absolute;width:22px;height:22px;border-radius:50%;z-index:30;cursor:pointer;
  display:grid;place-items:center;background:var(--c-action);color:var(--c-onaction);
  font-size:10.5px;font-weight:700;box-shadow:var(--c-shadow-dot);border:2px solid rgba(255,255,255,.85)}
.pulse-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--c-action);opacity:.55;animation:pd 2.1s ease-out infinite}
@keyframes pd{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.pulse-dot.peer{background:var(--c-peer);color:#fff}
.pulse-dot.peer::after{border-color:var(--c-peer)}

/* ── spotlight backdrop (wishlist 1.1) — one soft mask, not four rects ─ */
#spot{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;
  transition:opacity .3s ease,-webkit-mask-position .45s var(--t-ease)}
#spot.on{opacity:1}
#spot.clickable{pointer-events:auto;cursor:pointer}

/* ── placement compass (§4.4 / Tier 1) ──────────────────────────────── */
.cmp{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--b-accent);
  border:2px solid #fff;box-shadow:var(--c-shadow-dot);cursor:grab;z-index:40;
  transition:transform .12s,background .12s}
.cmp:hover{transform:scale(1.28)}
.cmp.on{background:var(--c-action);transform:scale(1.35)}
.cmp:active{cursor:grabbing}
.cmp.mid{width:11px;height:11px;opacity:.55}
#cmpring{position:absolute;z-index:39;pointer-events:none;border:1px dashed rgba(124,140,255,.45);
  border-radius:10px}
#offsetline{position:absolute;z-index:40;pointer-events:none;border-top:1px dashed var(--c-action);
  height:0}
#offsetline b{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--c-menu);
  border:1px solid var(--c-menu-b);color:var(--c-ink);font-size:10px;padding:1px 5px;border-radius:4px;
  font-weight:600}

/* ── the card (published-identical geometry, §4.2a rule 5/6) ────────── */
#cwrap{position:absolute;z-index:50}
#card{background:var(--b-surface);color:var(--b-ink);border-radius:var(--b-radius);
  box-shadow:var(--b-shadow);padding:var(--b-pad);display:flex;flex-direction:column;
  gap:var(--b-gap);border:var(--b-bw) solid var(--b-border);position:relative;
  font-size:var(--b-fs);line-height:var(--b-lh);overflow:visible;
  transition:background .3s,color .3s,border-radius .3s,box-shadow .3s}
#card.motion-fade{animation:mfade .34s ease}
#card.motion-lift{animation:mlift .38s var(--t-ease)}
#card.motion-scale{animation:mscale .34s var(--t-ease)}
#card.motion-pulse{animation:mpulse .5s ease}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mlift{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes mscale{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes mpulse{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
#card .arrow{position:absolute;width:12px;height:12px;background:var(--b-surface);
  border:var(--b-bw) solid var(--b-border);transform:rotate(45deg)}
.blk{position:relative;outline:none}
.blk[data-sel=1]{box-shadow:0 0 0 1.5px var(--c-action);border-radius:5px}
.blk.dragging{opacity:.4}
.blk.drop-before::before,.blk.drop-after::after{content:'';position:absolute;left:0;right:0;height:2px;
  background:var(--c-action);border-radius:2px}
.blk.drop-before::before{top:-5px} .blk.drop-after::after{bottom:-5px}
.b-h{font-size:var(--b-h-fs);font-weight:var(--b-h-w);letter-spacing:-.012em;line-height:1.3}
.b-h[data-lvl="2"]{font-size:calc(var(--b-h-fs) - 1px)}
.b-h[data-lvl="3"]{font-size:calc(var(--b-h-fs) - 2px);text-transform:uppercase;letter-spacing:.06em;
  opacity:.72;font-weight:700}
.b-p{color:var(--b-body)}
.b-p a,.b-link{color:var(--b-accent);text-decoration:underline;text-underline-offset:2px}
.b-list{color:var(--b-body);padding-left:17px;display:flex;flex-direction:column;gap:3px}
.b-list li{list-style:disc} .b-list[data-ord=1] li{list-style:decimal}
.b-div{height:1px;background:var(--b-border);margin:2px 0}
.b-media{border-radius:8px;overflow:hidden;position:relative;background:
  color-mix(in srgb,var(--b-accent) 12%,var(--b-surface));display:flex;align-items:center;
  justify-content:center;color:var(--b-accent);font-size:11.5px;font-weight:600;align-self:flex-start}
.b-media img{width:100%;height:100%;object-fit:var(--mfit,cover);display:block}
.b-media .ph{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px;text-align:center}
.b-media .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:10.5px;padding:14px 8px 6px;font-weight:500}
.b-media .playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;
  border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#111;
  box-shadow:0 3px 12px rgba(0,0,0,.28)}
.b-callout{display:flex;gap:9px;padding:10px 12px;border-radius:8px;font-size:calc(var(--b-fs) - .5px);
  line-height:1.5;border:1px solid}
.b-callout[data-tone=info]{background:color-mix(in srgb,var(--b-accent) 9%,var(--b-surface));
  border-color:color-mix(in srgb,var(--b-accent) 26%,transparent);color:var(--b-body)}
.b-callout[data-tone=success]{background:rgba(62,207,142,.11);border-color:rgba(62,207,142,.34);color:var(--b-body)}
.b-callout[data-tone=warning]{background:rgba(245,165,36,.13);border-color:rgba(245,165,36,.36);color:var(--b-body)}
.b-callout .ci{flex:none;margin-top:1px}
.b-stat{display:flex;gap:14px}
.b-stat .sv{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--b-ink);line-height:1.1}
.b-stat[data-em=strong] .sv{font-size:27px;color:var(--b-accent)}
.b-stat .sl{font-size:11px;color:var(--b-body);margin-top:2px}
.b-icon{display:flex;align-items:center;gap:9px;color:var(--b-accent)}
.b-icon .iw{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--b-accent) 14%,var(--b-surface))}
.b-icon .it{font-size:calc(var(--b-fs) - .5px);color:var(--b-body)}
.b-field{display:flex;flex-direction:column;gap:5px}
.b-field .fl{font-size:11.5px;font-weight:600;color:var(--b-ink)}
.b-field .fl .req{color:var(--c-bad)}
.b-field input[type=text]{border:1px solid var(--b-border);border-radius:var(--fr,7px);padding:7px 10px;
  font-size:12.5px;background:var(--b-surface);color:var(--b-ink);width:100%}
.b-field .opts{display:flex;flex-direction:column;gap:6px}
.b-field .opt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--b-body)}
.b-field .bx{width:15px;height:15px;border:1.5px solid var(--b-border);border-radius:4px;flex:none}
.b-field .bx.radio{border-radius:50%}
.b-field .scale{display:flex;gap:5px}
.b-field .scale span{flex:1;text-align:center;padding:7px 0;border:1px solid var(--b-border);
  border-radius:7px;font-size:12px;color:var(--b-body);cursor:default}
.b-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b-acts[data-layout=stack]{flex-direction:column;align-items:stretch}
.b-acts[data-align=center]{justify-content:center} .b-acts[data-align=end]{justify-content:flex-end}
.b-acts[data-align=stretch] .cta{flex:1}
.cta{padding:8px 14px;border-radius:var(--b-btn-r);font-size:12.5px;font-weight:600;border:1px solid transparent;
  cursor:default;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;
  position:relative;min-height:34px}
.cta[data-size=compact]{padding:5px 11px;font-size:12px;min-height:28px}
.cta[data-v=primary]{background:var(--b-accent);color:var(--b-onaccent)}
.cta[data-v=secondary]{background:color-mix(in srgb,var(--b-accent) 13%,var(--b-surface));color:var(--b-accent);
  border-color:color-mix(in srgb,var(--b-accent) 24%,transparent)}
.cta[data-v=subtle]{background:transparent;color:var(--b-body)}
.cta[data-v=outline]{background:transparent;color:var(--b-ink);border-color:var(--b-border)}
.cta[data-v=link]{background:transparent;color:var(--b-accent);text-decoration:underline;padding-left:2px;padding-right:2px}
.b-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;font-size:11px;
  font-weight:600;background:color-mix(in srgb,var(--b-accent) 12%,var(--b-surface));color:var(--b-accent);
  align-self:flex-start;border:1px solid color-mix(in srgb,var(--b-accent) 22%,transparent)}
.b-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;font-size:11px;
  font-weight:600;align-self:flex-start;border:1px solid}
.b-badge[data-s=ok]{background:rgba(62,207,142,.12);border-color:rgba(62,207,142,.35);color:#0d7a52}
.b-badge[data-s=warn]{background:rgba(245,165,36,.13);border-color:rgba(245,165,36,.36);color:#8a5a06}
.b-badge[data-s=bad]{background:rgba(242,85,90,.12);border-color:rgba(242,85,90,.34);color:#a12127}
body.previewing #card .blk[data-sel="1"]{box-shadow:none}
body.previewing #card [contenteditable]{caret-color:transparent;user-select:none}
body.previewing #card .cta{cursor:pointer}
body.previewing #card .cta:hover{filter:brightness(1.06)}
body.previewing #cwrap{cursor:default}
#card .cond-off{opacity:.42}
#card .cond-mark{position:absolute;left:-7px;top:50%;transform:translateY(-50%);width:3px;height:70%;
  border-radius:2px;background:var(--c-action);opacity:.7}

/* card frame + 8-edge resize (Tier 1) */
#frame{position:absolute;z-index:49;pointer-events:none;border:1px solid rgba(124,140,255,.62);
  border-radius:calc(var(--b-radius) + 3px)}
.rz{position:absolute;z-index:51;background:#fff;border:1.5px solid var(--c-action);border-radius:3px;
  width:9px;height:9px;pointer-events:auto}
.rz[data-h=n]{cursor:ns-resize} .rz[data-h=s]{cursor:ns-resize}
.rz[data-h=e]{cursor:ew-resize} .rz[data-h=w]{cursor:ew-resize}
.rz[data-h=ne]{cursor:nesw-resize} .rz[data-h=sw]{cursor:nesw-resize}
.rz[data-h=nw]{cursor:nwse-resize} .rz[data-h=se]{cursor:nwse-resize}
#sizetip{position:absolute;z-index:60;background:var(--c-menu);border:1px solid var(--c-menu-b);
  color:var(--c-ink);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;
  pointer-events:none;font-variant-numeric:tabular-nums}

/* gutter handles — rendered OUTSIDE the card box (§4.2a rule 6) */
#gutter{position:absolute;z-index:51;display:flex;flex-direction:column;gap:2px;width:22px}
.gh{width:20px;height:20px;border-radius:5px;background:rgba(20,22,28,.9);color:#cfd4de;
  display:grid;place-items:center;cursor:grab;opacity:0;transition:opacity .13s;border:none}
#cwrap:hover .gh,.gh.show{opacity:1}
.gh:hover{background:var(--c-ctl-h);color:#fff}
.gh:active{cursor:grabbing}
#cardtools{position:absolute;z-index:52;display:flex;flex-direction:column;gap:3px;
  opacity:0;transition:opacity .13s}
#cwrap:hover ~ #cardtools,#cardtools:hover,#cardtools.show{opacity:1}
#cardtools button{width:22px;height:22px;border-radius:6px;background:var(--c-glass);
  backdrop-filter:var(--c-blur);border:1px solid var(--c-border);color:var(--c-inksoft);
  display:grid;place-items:center;cursor:grab;box-shadow:var(--c-shadow)}
#cardtools button:hover{background:var(--c-ctl-h);color:#fff}
#addbtn{position:absolute;z-index:51;height:22px;padding:0 10px;border-radius:11px;
  background:var(--c-glass);backdrop-filter:var(--c-blur);border:1px solid var(--c-border);
  color:var(--c-ink);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;
  gap:5px;box-shadow:var(--c-shadow);opacity:0;transition:opacity .13s}
#cwrap:hover #addbtn{opacity:1}

/* ── toolbar (§4.2a) ────────────────────────────────────────────────── */
#tbar{position:absolute;z-index:60;display:flex;align-items:center;gap:2px;height:38px;padding:0 6px;
  background:var(--c-glass);backdrop-filter:var(--c-blur);border:1px solid var(--c-border);
  border-radius:var(--c-r-tb);box-shadow:var(--c-shadow);white-space:nowrap;color:var(--c-ink);
  transition:top var(--t-move) var(--t-ease),left var(--t-move) var(--t-ease),width var(--t-move)}
#tbar.docked{border-radius:0 0 var(--c-r-tb) var(--c-r-tb);border-top:none}
.tb{height:28px;min-width:28px;padding:0 7px;border:none;background:transparent;
  border-radius:var(--c-r-ctl);color:var(--c-ink);font-size:12.5px;cursor:pointer;display:flex;
  align-items:center;gap:6px;justify-content:center;flex:none}
.tb:hover{background:var(--c-ctl-h)}
.tb.act{background:var(--c-action);color:var(--c-onaction);font-weight:700}
.tb.wide{padding:0 10px}
.tb[disabled]{opacity:.35;cursor:not-allowed}
.tb .cw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.28);flex:none}
.tsep{width:1px;height:18px;background:var(--c-ctl-b);margin:0 4px;flex:none}
.tlbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--c-mut);
  padding:0 7px 0 3px;font-weight:700}
#tctx{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
#tctx.swap{animation:swapin .22s ease}
@keyframes swapin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* menus that float above glass */
.menu{position:absolute;z-index:95;background:var(--c-menu);border:1px solid var(--c-menu-b);
  border-radius:9px;box-shadow:var(--c-shadow-r);padding:5px;min-width:196px;color:var(--c-ink);
  max-height:70vh;overflow-y:auto}
.menu .mh{padding:7px 9px 5px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--c-subtle);font-weight:700}
.menu button,.menu .mi{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
  padding:7px 9px;border-radius:6px;color:var(--c-inksoft);cursor:pointer;text-align:left;font-size:12px}
.menu button:hover,.menu .mi:hover{background:var(--c-ctl-h);color:#fff}
.menu button.on{background:var(--c-action);color:var(--c-onaction);font-weight:700}
.menu button[disabled]{opacity:.4;cursor:not-allowed}
.menu button[disabled]:hover{background:none;color:var(--c-inksoft)}
.menu kbd{margin-left:auto;font:10px ui-monospace,Menlo,monospace;color:var(--c-subtle);
  background:none;padding-left:8px}
.menu .msep{height:1px;background:var(--c-menu-b);margin:4px 0}
.menu .mnote{padding:6px 9px;font-size:11px;color:var(--c-mut);line-height:1.5}
.menu .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}
.menu .grid4 button{flex-direction:column;gap:4px;padding:8px 4px;font-size:10px;text-align:center;
  justify-content:center;color:var(--c-mut)}
.swrow{display:flex;gap:5px;padding:5px 9px 8px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(255,255,255,.16);cursor:pointer}
.sw.on{outline:2px solid var(--c-action);outline-offset:2px}

/* ── inspector popover (§4.3) ───────────────────────────────────────── */
#insp{position:absolute;z-index:70;width:320px;max-height:60vh;background:var(--c-glass);
  backdrop-filter:var(--c-blur);border:1px solid var(--c-border);border-radius:var(--c-r-insp);
  box-shadow:var(--c-shadow-r);display:flex;flex-direction:column;overflow:hidden;color:var(--c-ink);
  transition:top var(--t-move) var(--t-ease),left var(--t-move) var(--t-ease)}
#insp header{display:flex;align-items:center;gap:8px;padding:9px 10px;
  border-bottom:1px solid var(--c-border);flex:none;cursor:grab}
#insp header b{font-size:12.5px;font-weight:600}
#insp header .tag{margin-left:auto}
.ix{width:24px;height:24px;border-radius:6px;border:none;background:var(--c-quiet);color:#c3c9d6;
  cursor:pointer;display:grid;place-items:center;flex:none}
.ix:hover{background:var(--c-ctl-h);color:#fff}
#insp .ibody{overflow-y:auto;padding:2px 0 8px}
#leader{position:absolute;z-index:69;pointer-events:none;border-top:1px dashed rgba(124,140,255,.5)}
.isec{border-bottom:1px solid var(--c-border-s)}
.isec:last-child{border-bottom:none}
.isec>summary{padding:9px 11px;font-size:12px;cursor:pointer;list-style:none;display:flex;
  align-items:center;gap:7px;color:var(--c-inksoft);user-select:none}
.isec>summary::-webkit-details-marker{display:none}
.isec>summary:hover{background:rgba(255,255,255,.035)}
.isec[open]>summary{color:#fff;font-weight:600}
.isec>summary .chev{margin-left:auto;transition:transform .15s;color:var(--c-subtle)}
.isec[open]>summary .chev{transform:rotate(90deg)}
.isec .ic{padding:2px 11px 12px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:8px;min-height:26px}
.fld>label{font-size:11.5px;color:var(--c-mut);flex:none}
.fld .v{display:flex;align-items:center;gap:5px;min-width:0}
.fld.col{flex-direction:column;align-items:stretch;gap:5px}
.fld.col>label{margin-bottom:1px}
.pk{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-ink);border-radius:var(--c-r-ctl);
  padding:5px 9px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;
  min-height:26px;white-space:nowrap}
.pk:hover{background:var(--c-ctl-h)}
.pk.grow{width:100%;justify-content:space-between}
.pk .sws{width:13px;height:13px;border-radius:3px;border:1px solid #4a5162;flex:none}
.ovr{width:6px;height:6px;border-radius:50%;background:var(--c-action);flex:none}
.inum{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-ink);border-radius:var(--c-r-ctl);
  padding:5px 7px;font-size:11.5px;width:66px;text-align:right;font-variant-numeric:tabular-nums}
.itext{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-ink);border-radius:var(--c-r-ctl);
  padding:6px 9px;font-size:11.5px;width:100%;resize:vertical;line-height:1.5}
.itext:focus,.inum:focus{outline:none;border-color:var(--c-focus);box-shadow:0 0 0 2px rgba(124,140,255,.22)}
.seg{display:flex;background:#0f1218;border-radius:7px;padding:2px;gap:2px}
.seg button{border:none;background:none;color:var(--c-mut);font-size:11px;padding:4px 8px;border-radius:5px;
  cursor:pointer;flex:1;white-space:nowrap;display:flex;align-items:center;gap:4px;justify-content:center}
.seg button.on{background:var(--c-action);color:var(--c-onaction);font-weight:700}
.rng{-webkit-appearance:none;width:100%;height:4px;background:#0f1218;border-radius:3px;outline:none}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--c-action);cursor:pointer;border:2px solid #14161c}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:4px 9px;border-radius:6px;background:var(--c-ctl);border:1px solid var(--c-ctl-b);
  font-size:11px;cursor:pointer;color:var(--c-inksoft)}
.chip:hover{background:var(--c-ctl-h)}
.chip.on{background:var(--c-action);border-color:var(--c-action);color:var(--c-onaction);font-weight:700}
.imenu{background:var(--c-menu);border:1px solid var(--c-menu-b);border-radius:7px;overflow:hidden;margin-top:8px}
.imenu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;font-size:11.5px;
  background:none;border:none;border-bottom:1px solid var(--c-menu-b);color:var(--c-inksoft);
  cursor:pointer;text-align:left}
.imenu button:last-child{border-bottom:none}
.imenu button:hover{background:var(--c-ctl-h);color:#fff}
.imenu button[disabled]{opacity:.4;cursor:not-allowed}
.imenu kbd{margin-left:auto;font:10px ui-monospace,Menlo,monospace;color:var(--c-subtle)}
.hint{font-size:11px;line-height:1.55;color:var(--c-subtle);margin-top:7px}
.tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;padding:2.5px 7px;border-radius:5px;
  font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:rgba(62,207,142,.15);color:#5fe0ab} .tag.w{background:rgba(245,165,36,.16);color:#f7bd5c}
.tag.b{background:rgba(242,85,90,.15);color:#ff8b8f} .tag.n{background:#232838;color:#9fb0e0}
.tag.p{background:rgba(15,155,108,.2);color:#4fd7a8}
.tag.a{background:rgba(124,140,255,.18);color:#a9b4ff}
.evline{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--c-inksoft);
  padding:5px 0;line-height:1.5}
.evline .ei{flex:none;margin-top:1px}
.steps-num{counter-reset:sn;display:flex;flex-direction:column;gap:3px}
.steps-num .sr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--c-inksoft);
  background:var(--c-ctl);border:1px solid var(--c-ctl-b);border-radius:6px;padding:6px 8px;cursor:grab}
.steps-num .sr b{color:#fff;font-weight:600}
.steps-num .sr .n{width:16px;height:16px;border-radius:4px;background:#0f1218;display:grid;
  place-items:center;font-size:9.5px;color:var(--c-mut);flex:none;font-weight:700}
.steps-num .sr .x{margin-left:auto;opacity:.5;cursor:pointer}
.steps-num .sr .x:hover{opacity:1;color:var(--c-bad)}
/* ── mode pill (§4.1) — never allowed to grow into a rail ───────────── */
#pill{position:absolute;z-index:80;display:flex;align-items:center;gap:9px;height:38px;
  padding:0 8px 0 5px;background:var(--c-glass);backdrop-filter:var(--c-blur);
  border:1px solid var(--c-border);border-radius:11px;color:var(--c-ink);font-size:12px;
  box-shadow:var(--c-shadow);transition:left var(--t-avoid) var(--t-ease),top var(--t-avoid) var(--t-ease),
  width .18s,height .18s,border-radius .18s;user-select:none}
#pill.collapsed{width:28px;height:28px;padding:0;border-radius:50%;justify-content:center;cursor:pointer;
  overflow:hidden}
#pill.collapsed>*{display:none}
#pill.collapsed::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--c-action);display:block}
#pill.dragging{transition:none;cursor:grabbing}
#modesw{display:flex;background:#0c0e13;border-radius:8px;padding:2px;gap:2px}
#modesw button{border:none;background:none;color:var(--c-mut);font-size:12px;padding:6px 11px;
  border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500}
#modesw button:hover{color:var(--c-ink)}
#modesw button.on{background:var(--c-action);color:var(--c-onaction);font-weight:700}
.pmeta{color:var(--c-mut);font-size:11.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.pmeta b{color:var(--c-ink);font-weight:600}
.pmeta .sep{width:1px;height:13px;background:var(--c-border)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c-ok);flex:none}
.dot.w{background:var(--c-warn)} .dot.b{background:var(--c-bad)} .dot.a{background:var(--c-action)}
.dot.spin{animation:spin 1s linear infinite;border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.pbtn{height:24px;min-width:24px;padding:0 7px;border-radius:6px;background:var(--c-quiet);color:#c3c9d6;
  border:none;cursor:pointer;font-size:11.5px;display:flex;align-items:center;gap:5px;justify-content:center}
.pbtn:hover{background:var(--c-ctl-h);color:#fff}
.pbtn.pri{background:var(--c-action);color:var(--c-onaction);font-weight:700}
.pbtn.pri:hover{background:var(--c-action-h)}
.pgrip{width:12px;color:var(--c-subtle);cursor:grab;display:grid;place-items:center;flex:none}
.faces{display:flex;align-items:center}
.faces .f{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c-canvas);margin-left:-6px;
  display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;cursor:pointer}
.faces .f:first-child{margin-left:0}
#showchip{position:absolute;z-index:90;right:16px;bottom:16px;display:none;align-items:center;gap:7px;
  height:32px;padding:0 12px;background:var(--c-glass);backdrop-filter:var(--c-blur);
  border:1px solid var(--c-border);border-radius:16px;color:var(--c-ink);font-size:12px;cursor:pointer;
  box-shadow:var(--c-shadow)}
body.hidechrome #showchip{display:flex}

/* ── filmstrip (§4.5) ───────────────────────────────────────────────── */
#film{position:absolute;z-index:80;display:flex;align-items:flex-end;gap:0;padding:7px;
  background:var(--c-glass);backdrop-filter:var(--c-blur);border:1px solid var(--c-border);
  border-radius:12px;box-shadow:var(--c-shadow);max-width:min(72vw,940px);overflow-x:auto;
  overflow-y:hidden;transition:left var(--t-avoid) var(--t-ease),top var(--t-avoid) var(--t-ease),opacity .16s}
#film::-webkit-scrollbar{height:5px}
.fcell{display:flex;align-items:stretch;flex:none}
.fs{width:74px;padding:5px 5px 6px;border-radius:8px;background:var(--c-ctl);border:1px solid transparent;
  cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px;flex:none}
.fs:hover{background:var(--c-ctl-h)}
.fs.on{background:rgba(124,140,255,.17);border-color:var(--c-action)}
.fs.multi{box-shadow:inset 0 0 0 1.5px var(--c-action)}
.fs.dragging{opacity:.4}
.fs .thumb{height:36px;border-radius:5px;background:#0f1218;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:2.5px;padding:5px 5px 0}
.fs .thumb i{display:block;height:2.5px;border-radius:2px;background:#39404f}
.fs .thumb i.a{background:var(--c-action);opacity:.75;width:62%}
.fs .thumb i.b{width:88%} .fs .thumb i.c{width:70%}
.fs .thumb .bt{position:absolute;left:5px;bottom:4px;height:6px;width:20px;border-radius:2px;
  background:var(--c-action);opacity:.8}
.fs .ttl{font-size:10px;color:var(--c-inksoft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3}
.fs.on .ttl{color:#fff;font-weight:600}
.fs .nb{position:absolute;left:8px;top:8px;font-size:9px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.55);border-radius:3px;padding:0 4px;line-height:13px}
.fs .sdot{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%}
.fs .sdot.ok{background:var(--c-ok)} .fs .sdot.ctx{background:var(--c-warn)}
.fs .sdot.bad{background:var(--c-bad)} .fs .sdot.draft{background:var(--c-subtle)}
.fs .sdot.peer{background:var(--c-peer);box-shadow:0 0 0 2px rgba(15,155,108,.3)}
.fs .brc{position:absolute;right:6px;bottom:20px;color:var(--c-action)}
.fs .lockc{position:absolute;left:6px;bottom:20px;color:var(--c-peer)}
.finsert{width:12px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;position:relative;opacity:0;transition:opacity .12s}
.finsert:hover,.finsert.armed{opacity:1}
.finsert::before{content:'';position:absolute;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--c-action)}
.finsert span{position:relative;z-index:1;width:15px;height:15px;border-radius:50%;background:var(--c-action);
  color:var(--c-onaction);display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
#film .fadd{width:38px;align-self:stretch;min-height:63px;border-radius:8px;background:transparent;
  border:1px dashed var(--c-ctl-b);color:var(--c-mut);cursor:pointer;display:grid;place-items:center;flex:none;
  margin-left:4px}
#film .fadd:hover{border-color:var(--c-action);color:var(--c-action)}
#film .fhead{writing-mode:vertical-rl;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--c-subtle);padding:0 6px 4px 2px;font-weight:700;align-self:center}

/* ── bands: picker instruction, freeze, preview, lock (§3.3/§4.4a) ──── */
.band{position:absolute;left:0;right:0;z-index:90;display:flex;align-items:center;gap:12px;
  padding:9px 14px;background:var(--c-glass);backdrop-filter:var(--c-blur);color:var(--c-ink);
  font-size:12.5px;border-bottom:1px solid var(--c-border)}
.band.bot{border-bottom:none;border-top:1px solid var(--c-border)}
.band .bb{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-ink);padding:6px 12px;
  border-radius:7px;cursor:pointer;font-size:11.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.band .bb:hover{background:var(--c-ctl-h)}
.band .bb.pri{background:var(--c-action);border-color:var(--c-action);color:var(--c-onaction);font-weight:700}
.band .bb.pri:hover{background:var(--c-action-h)}
.band .grow{flex:1}
.crumb{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--c-mut);flex-wrap:wrap;min-width:0}
.crumb button{background:none;border:none;color:var(--c-mut);cursor:pointer;padding:3px 7px;border-radius:5px;
  font-size:11.5px;white-space:nowrap}
.crumb button:hover{background:var(--c-ctl-h);color:#fff}
.crumb button.on{color:#fff;font-weight:600;background:var(--c-ctl)}
.crumb .sl{color:#4d5464;flex:none}
#hilite{position:absolute;z-index:29;pointer-events:none;background:rgba(124,140,255,.14);
  border:1px solid var(--c-action);border-radius:5px;transition:all .09s linear}
#hilite.alt{background:rgba(245,165,36,.14);border-color:var(--c-warn)}
.hovcard{position:absolute;z-index:92;background:var(--c-menu);border:1px solid var(--c-menu-b);
  border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--c-ink);min-width:212px;max-width:280px;
  box-shadow:var(--c-shadow-r);pointer-events:none}
.hovcard.pinned{pointer-events:auto;border-color:var(--c-action)}
.hovcard .t{font-weight:600;margin-bottom:4px;font-size:12px;display:flex;align-items:center;gap:6px}
.hovcard .m{color:var(--c-mut);font-size:11px;line-height:1.55}
.hovcard .cnt{margin-top:7px;padding-top:7px;border-top:1px solid var(--c-menu-b);color:#a5b4fc;
  font-size:11px;display:flex;align-items:center;gap:6px}
.hovcard .pinhint{margin-top:6px;font-size:10px;color:var(--c-subtle)}

/* ── toasts ─────────────────────────────────────────────────────────── */
#toasts{position:absolute;z-index:110;top:14px;left:50%;transform:translateX(-50%);display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:min(90vw,620px)}
.toast{background:var(--c-menu);border:1px solid var(--c-menu-b);border-radius:10px;padding:9px 13px;
  font-size:12px;color:var(--c-ink);display:flex;align-items:center;gap:11px;box-shadow:var(--c-shadow-r);
  pointer-events:auto;animation:tin .22s var(--t-ease)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast .tb2{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-ink);padding:4px 10px;
  border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap}
.toast .tb2:hover{background:var(--c-ctl-h)}
.toast.ok{border-color:rgba(62,207,142,.4)} .toast.bad{border-color:rgba(242,85,90,.45)}
.toast.warn{border-color:rgba(245,165,36,.45)}

/* ── command palette / Ask Lodariq (§7.5) ───────────────────────────── */
#palette{position:absolute;z-index:110;left:50%;top:88px;transform:translateX(-50%);width:min(620px,92vw);
  background:var(--c-menu);border:1px solid var(--c-menu-b);border-radius:13px;box-shadow:var(--c-shadow-r);
  overflow:hidden;color:var(--c-ink)}
#palette .pin{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--c-menu-b)}
#palette input{background:none;border:none;outline:none;font-size:14px;color:var(--c-ink);flex:1}
#palette input::placeholder{color:var(--c-subtle)}
#palette .plist{max-height:320px;overflow-y:auto;padding:6px}
#palette .prow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;
  font-size:12.5px;color:var(--c-inksoft)}
#palette .prow:hover,#palette .prow.on{background:var(--c-ctl-h);color:#fff}
#palette .prow .sub{color:var(--c-subtle);font-size:11px;margin-left:auto}
#palette .pv{padding:14px 15px;border-top:1px solid var(--c-menu-b);background:#12151d}
#palette .pv .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--c-subtle);
  font-weight:700;margin-bottom:8px}
#palette .diff{font:11.5px/1.7 ui-monospace,Menlo,monospace;background:#0b0d12;border:1px solid var(--c-menu-b);
  border-radius:8px;padding:10px 12px;color:var(--c-mut);white-space:pre-wrap}
#palette .diff .add{color:#6ee7b7;background:rgba(62,207,142,.09);display:block}
#palette .diff .del{color:#fca5a5;background:rgba(242,85,90,.09);display:block;text-decoration:line-through}
#palette .pacts{display:flex;gap:8px;margin-top:11px;justify-content:flex-end}

/* ── preview runtime chrome (§4.7) ──────────────────────────────────── */
#pvbar{position:absolute;z-index:100;display:flex;align-items:center;gap:9px;height:40px;padding:0 8px 0 12px;
  background:var(--c-glass);backdrop-filter:var(--c-blur);border:1px solid var(--c-border);
  border-radius:12px;color:var(--c-ink);font-size:12px;box-shadow:var(--c-shadow);user-select:none}
#pvbar .scrub{width:150px;height:4px;background:#0f1218;border-radius:3px;position:relative;cursor:pointer}
#pvbar .scrub i{position:absolute;left:0;top:0;bottom:0;background:var(--c-action);border-radius:3px}
#pvbar .scrub b{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);transform:translateX(-50%)}
#capt{position:absolute;z-index:100;left:50%;bottom:88px;transform:translateX(-50%);max-width:min(70vw,620px);
  background:rgba(8,9,13,.86);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;
  line-height:1.5;text-align:center;backdrop-filter:blur(6px)}

/* ── Operations sheet (§4.6) ────────────────────────────────────────── */
#sheet{position:absolute;inset:0;z-index:100;background:#0f1117;display:grid;
  grid-template-columns:214px 1fr;color:var(--c-ink);animation:sheetin .2s var(--t-ease)}
@keyframes sheetin{from{opacity:0;transform:scale(.995)}to{opacity:1;transform:none}}
#sheet .snav{border-right:1px solid var(--c-border);padding:12px 9px;background:#0b0d12;overflow-y:auto;
  display:flex;flex-direction:column}
#sheet .snav .stitle{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-size:13px;
  font-weight:700;letter-spacing:-.02em}
#sheet .snav .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--c-subtle);
  padding:13px 9px 5px;font-weight:700}
#sheet .snav button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;
  color:var(--c-mut);cursor:pointer;font-size:12.3px;background:none;border:none;text-align:left}
#sheet .snav button:hover{background:#161a22;color:#fff}
#sheet .snav button.on{background:#232a3d;color:#fff;font-weight:600}
#sheet .snav button .bdg{margin-left:auto;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:9px;
  background:var(--c-ctl);color:var(--c-mut)}
#sheet .snav button .bdg.warn{background:rgba(245,165,36,.18);color:#f7bd5c}
#sheet .snav button .bdg.bad{background:rgba(242,85,90,.18);color:#ff8b8f}
#sheet .sbody{overflow-y:auto;padding:22px 26px 46px;position:relative}
#sheet .sclose{position:absolute;right:16px;top:14px;background:var(--c-ctl);border:1px solid var(--c-ctl-b);
  color:var(--c-ink);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;z-index:3;
  display:flex;align-items:center;gap:7px}
#sheet .sclose:hover{background:var(--c-ctl-h)}
.shead{margin-bottom:18px;max-width:74ch}
.shead h2{font-size:18px;letter-spacing:-.025em;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.shead p{color:var(--c-mut);font-size:12.5px;line-height:1.65}
.box{background:#141821;border:1px solid var(--c-border);border-radius:11px;padding:15px;margin-bottom:13px}
.box>h3{font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:600}
.box>h3 .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.box .bd{font-size:12px;color:var(--c-mut);line-height:1.65;margin-bottom:10px}
.cols{display:grid;gap:13px} .c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))} .c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sbtn{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-ink);padding:7px 12px;
  border-radius:8px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap}
.sbtn:hover{background:var(--c-ctl-h)}
.sbtn.pri{background:var(--c-action);border-color:var(--c-action);color:var(--c-onaction);font-weight:700}
.sbtn.pri:hover{background:var(--c-action-h)}
.sbtn.danger{border-color:rgba(242,85,90,.4);color:#ff8b8f}
.sbtn.danger:hover{background:rgba(242,85,90,.14)}
.sbtn[disabled]{opacity:.4;cursor:not-allowed}
.sbtn.sm{padding:4px 9px;font-size:11px}
.lst{list-style:none;font-size:12px;color:var(--c-inksoft)}
.lst li{padding:9px 0;border-bottom:1px solid var(--c-border-s);display:flex;justify-content:space-between;
  align-items:center;gap:14px;line-height:1.55}
.lst li:last-child{border-bottom:none}
.lst .lm{color:var(--c-mut);font-size:11.5px;margin-top:2px}
table.dt{width:100%;border-collapse:collapse;font-size:11.5px}
table.dt th{text-align:left;padding:8px 10px;color:var(--c-subtle);font-weight:700;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--c-border)}
table.dt td{padding:9px 10px;border-bottom:1px solid #1a1e27;color:var(--c-inksoft);vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt td.k{color:#fff;font-weight:500}
table.dt tr.sel{background:rgba(124,140,255,.09)}
.meter{height:7px;background:#1c2130;border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--c-action)}
.meter i.ok{background:var(--c-ok)} .meter i.w{background:var(--c-warn)} .meter i.b{background:var(--c-bad)}
.barrow{display:grid;grid-template-columns:120px 1fr auto;gap:11px;align-items:center;font-size:11.5px;
  margin-bottom:8px;color:var(--c-inksoft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:11.5px}
.kv dt{color:var(--c-mut)} .kv dd{color:var(--c-ink);text-align:right;font-variant-numeric:tabular-nums}
.note{border-radius:0 8px 8px 0;padding:10px 13px;font-size:11.5px;line-height:1.65;margin-bottom:11px;
  border:1px solid;border-left-width:2px}
.note.w{background:#241a10;border-color:#4a3416;border-left-color:var(--c-warn);color:#e0c08a}
.note.g{background:#0f2119;border-color:#1c4634;border-left-color:var(--c-ok);color:#93d9b8}
.note.b{background:#241214;border-color:#4d2024;border-left-color:var(--c-bad);color:#f0a8ab}
.note.i{background:#141a2b;border-color:#25304d;border-left-color:var(--c-action);color:#b3bfea}
.swatchset{display:flex;gap:9px;margin:10px 0 20px;flex-wrap:wrap}
.swx{width:44px;height:44px;border-radius:9px;border:1px solid var(--c-border);position:relative;cursor:pointer}
.swx small{position:absolute;bottom:-16px;left:-6px;right:-6px;text-align:center;font-size:8.5px;
  color:var(--c-subtle);white-space:nowrap}
.swx.on{outline:2px solid var(--c-action);outline-offset:2px}
.prevcard{border-radius:var(--pr,12px);padding:14px;font-size:12px;line-height:1.5}
.mono{font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;background:#080a0e;
  border:1px solid var(--c-border);border-radius:8px;padding:11px;color:#78829a;white-space:pre-wrap;
  max-height:280px;overflow:auto}
.pill-tab{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.pill-tab button{background:var(--c-ctl);border:1px solid var(--c-ctl-b);color:var(--c-mut);
  padding:6px 12px;border-radius:20px;font-size:11.5px;cursor:pointer}
.pill-tab button.on{background:var(--c-action);border-color:var(--c-action);color:var(--c-onaction);font-weight:700}
.grp2{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--c-subtle);
  font-weight:700;margin-bottom:9px}

/* flow map (§4.6 Map) */
#mapwrap{position:relative;height:calc(100vh - 210px);min-height:400px;background:#0b0d12;
  border:1px solid var(--c-border);border-radius:12px;overflow:hidden;
  background-image:radial-gradient(circle,#1b202b 1px,transparent 1px);background-size:22px 22px}
#mapcanvas{position:absolute;inset:0;transform-origin:0 0}
.mnode{position:absolute;width:174px;background:#161b26;border:1px solid var(--c-border);border-radius:10px;
  padding:9px 11px;cursor:grab;user-select:none;box-shadow:0 4px 14px -4px rgba(0,0,0,.5)}
.mnode:hover{border-color:#3f4759}
.mnode.on{border-color:var(--c-action);box-shadow:0 0 0 2px rgba(124,140,255,.25)}
.mnode.dragging{cursor:grabbing;z-index:5}
.mnode .mt{font-size:11.5px;font-weight:600;color:#fff;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.mnode .mm{font-size:10.5px;color:var(--c-mut);line-height:1.45}
.mnode .mn{font-size:9px;font-weight:700;color:var(--c-onaction);background:var(--c-action);border-radius:4px;
  padding:0 5px;line-height:14px;flex:none}
.mnode.entry{border-color:rgba(62,207,142,.5)} .mnode.entry .mn{background:var(--c-ok)}
.mnode.exit{border-style:dashed}
.mport{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--c-ctl);
  border:1.5px solid #4a5162;cursor:crosshair;z-index:3}
.mport:hover{background:var(--c-action);border-color:var(--c-action);transform:scale(1.25)}
.mport.out{right:-6px;top:50%;margin-top:-5.5px} .mport.in{left:-6px;top:50%;margin-top:-5.5px}
#mapsvg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.medge{fill:none;stroke:#3a4254;stroke-width:1.6}
.medge.cond{stroke:var(--c-warn);stroke-dasharray:5 4}
.medge.on{stroke:var(--c-action);stroke-width:2.2}
.melabel{position:absolute;background:#1a1e28;border:1px solid var(--c-menu-b);border-radius:5px;

/* ── undo / redo over the document (§7.4 guardrail: two distinct undos) ── */
function snapshot(){return JSON.stringify({steps:DOC.steps,branches:DOC.branches,theme:DOC.activeTheme,
  themeOverrides:DOC.themeOverrides})}
function pushUndo(label){
  S.undo.push({label,data:snapshot()});
  if(S.undo.length>60) S.undo.shift();
  S.redo.length=0; markDirty();
}
function applySnap(data){
  const d=JSON.parse(data);
  DOC.steps=d.steps; DOC.branches=d.branches; DOC.activeTheme=d.theme; DOC.themeOverrides=d.themeOverrides;
  applyTheme(DOC.activeTheme,DOC.themeOverrides);
  S.step=clamp(S.step,0,DOC.steps.length-1);
}
function undo(){
  if(!S.undo.length) return toast('Nothing to undo');
  const cur=snapshot(), e=S.undo.pop(); S.redo.push({label:e.label,data:cur});
  applySnap(e.data); paint(); toast('Undid — '+e.label,'',2200);
}
function redo(){
  if(!S.redo.length) return toast('Nothing to redo');
  const cur=snapshot(), e=S.redo.pop(); S.undo.push({label:e.label,data:cur});
  applySnap(e.data); paint(); toast('Redid — '+e.label,'',2200);
}
/* §8.1 transactional queue: every mutation is enqueued and acknowledged in order,
   so rapid edits cannot overwrite one another. Debounce is not a correctness tool. */
const QUEUE={pending:[],inflight:false,seq:0};
let saveTimer=null;
function markDirty(){
  QUEUE.pending.push(++QUEUE.seq);
  S.save='saving'; drawPill();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ QUEUE.pending.length=0; S.save='saved'; drawPill(); },520);
}

function spark(pts,color='#4f46e5'){
  const w=140,h=34,max=Math.max(...pts),min=Math.min(...pts);
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*w).toFixed(1)},${(h-((p-min)/(max-min||1))*(h-4)-2).toFixed(1)}`).join('');
  return `<svg class="a-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
    <path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".08"/></svg>`;
}
function bars(vals,labels){

    <div class="a-search" ${T('app-search','Search Meridian','search box')}>${icon('search',14)}<span>Search…</span>
      <span style="margin-left:auto;font-size:10.5px;color:#98a2b3">⌘K</span></div>
    <button class="a-icobtn" ${T('btn-notify','Notifications','button')} data-pop="notify">${icon('bell',17)}<i class="bdg"></i></button>
    <button class="a-icobtn" ${T('btn-help','Help','button')}>${icon('help',17)}</button>
    <button class="a-av" ${T('btn-account','Your account','button')} data-pop="account">MS</button>
  </div>
  <div class="a-body">
    <div class="a-side">
      ${side.length?`<div class="grp">${APP.route}</div>`:''}
      ${side.map(([k,n,ic,ct])=>`<button ${T('side-'+k,n,'menu item')} class="${APP.side===k?'on':''}" data-side="${k}">
        ${icon(ic,15)}<span>${n}</span>${ct!=null?`<span class="ct">${ct}</span>`:''}</button>`).join('')}
      <div style="flex:1"></div>
      <div class="grp">Workspace</div>
      <button ${T('side-usage','Usage this month','menu item')}>${icon('gauge',15)}<span>Usage</span>
        <span class="ct">62%</span></button>
    </div>
    <div class="a-main app-scroll" id="a-main">${ROUTES[APP.route]?ROUTES[APP.route]():''}</div>
  </div>`;
  $$('[data-go]',w).forEach(b=>b.onclick=()=>appNav(b.dataset.go));
  $$('[data-side]',w).forEach(b=>b.onclick=()=>{APP.side=b.dataset.side;renderApp();afterAppRender()});
  $$('[data-pop]',w).forEach(b=>b.onclick=e=>{e.stopPropagation();openAppPop(b.dataset.pop,b)});
  $$('[data-modal]',w).forEach(b=>b.onclick=e=>{e.stopPropagation();openAppModal(b.dataset.modal)});
  $$('[data-appact]',w).forEach(b=>b.onclick=e=>{e.stopPropagation();appAction(b.dataset.appact,b)});
  afterAppRender();
}
function appNav(route){
  APP.route=route; APP.side=(SIDE[route]||[['x']])[0][0]; APP.pop=null; APP.modal=null;
  renderApp();
  if(S.recording) recordClick('nav-'+route,NAV.find(n=>n[0]===route)[1],'navigation link');
}
function afterAppRender(){ requestAnimationFrame(()=>{ solve(); drawPulses(); }); }

/* Which transient layer reveals which targets. This is the runtime half of an

   recorded way (§4.4). Semantic, not a timer. */
const REVEALS={
  pop:{ import:['menu-import-csv','menu-import-jira','menu-import-linear','menu-import-sheets','menu-savefilter'],
        account:['menu-profile','menu-prefs','menu-keys','menu-switch','menu-signout'],
        notify:['notif-0','notif-1','notif-2','menu-allnotif'],
        filter:['filter-0','filter-1','filter-2','filter-3'] },
  modal:{ create:['inp-proj-name','sel-template','sel-team','btn-modal-create','btn-modal-close','btn-modal-cancel'],
          import:['drop-csv','sel-import-kind','tgl-import-email','btn-modal-import'],
          invite:['inp-invite-emails','sel-invite-role','btn-modal-invite'],
          plan:['plan-starter','plan-growth','plan-scale','btn-modal-plan'],
          report:['sel-metric','sel-groupby','btn-modal-report'] }
};
const OPENER_FOR={ import:'btn-import', account:'btn-account', notify:'btn-notify', filter:'btn-filter' };
/** Reach a target the recorded way. Returns true if it had to open something. */
function ensureTargetPresent(t){
  if(!t||findTargetEl(t)) return false;
  if(t.route&&t.route!==APP.route){ APP.route=t.route; APP.side=(SIDE[t.route]||[['x']])[0][0]; renderApp();
    if(findTargetEl(t)) return true }
  for(const [k,keys] of Object.entries(REVEALS.pop))
    if(keys.includes(t.key)){ const a=$(`#appwin [data-lq="${OPENER_FOR[k]}"]`);
      if(a){ openAppPop(k,a); return true } }
  for(const [k,keys] of Object.entries(REVEALS.modal))
    if(keys.includes(t.key)){ openAppModal(k); return true }
  return false;
}

/* find a live element for a target descriptor */
function findTargetEl(t){
  if(!t) return null;
  return $(`#appwin [data-lq="${t.key}"]`);
}
function targetState(t){
  if(!t) return 'draft';
  if(t.broken) return 'bad';
  const live=findTargetEl(t);
  if(live) return 'ok';
  return t.needsApproach||t.route!==APP.route?'ctx':'bad';
}
/* ══════════════════════════════════════════════════════════════════════════
   THE CARD — rich content editor. Renders as its published self (§4.2a r5):
   no input borders, no focus rings on body text, no field chrome. The only
   editing affordances inside the box are the caret, the selection, and a
   thin outline on a selected decorator. Everything else is chrome outside.
   ══════════════════════════════════════════════════════════════════════════ */
const GRADS={ 'grad-1':'linear-gradient(135deg,#6366f1,#a855f7 55%,#ec4899)',
  'grad-2':'linear-gradient(135deg,#0ea5e9,#22d3ee 60%,#34d399)',
  'grad-3':'linear-gradient(135deg,#f59e0b,#ef4444)',
  'grad-4':'linear-gradient(135deg,#111827,#4b5563)' };
const ICONS_B={info:'info',check:'check',warning:'alert',star:'star',rocket:'rocket',search:'search',
  link:'link',lock:'lock',target:'target',settings:'settings',heart:'star',sparkles:'sparkle',
  play:'play',flag:'flag',bell:'bell',calendar:'calendar',home:'home',user:'user',users:'users',
  mail:'mail',globe:'globe',clock:'clock',camera:'camera',image:'image',video:'video',music:'music',
  spark:'sparkle'};

function runsHTML(runs){
  return (runs||[]).map(r=>{
    let h=esc(r.t);
    if(r.marks?.includes('bold')) h=`<b>${h}</b>`;
    if(r.marks?.includes('italic')) h=`<i>${h}</i>`;
    if(r.marks?.includes('underline')) h=`<u>${h}</u>`;
    const st=[]; if(r.color) st.push('color:'+r.color); if(r.size) st.push('font-size:'+r.size+'px');
    if(r.href) return `<a href="#" class="b-link" data-href="${esc(r.href)}" style="${st.join(';')}">${h}</a>`;
    if(st.length) h=`<span style="${st.join(';')}">${h}</span>`;
    return h;
  }).join('');
}
function textOf(b){ return b.runs?b.runs.map(r=>r.t).join(''):(b.text||'') }

function blockHTML(b,i){
  const sel=S.sel.blockId===b.id?' data-sel="1"':'';
  const cond=b.showWhen?`<span class="cond-mark" title="Conditional content"></span>`:'';
  const off=b.showWhen&&!evalCond(b.showWhen)?' cond-off':'';
  const A=`class="blk b-${b.type}${off}" data-blk="${b.id}" data-i="${i}"${sel}`;
  switch(b.type){
    case 'heading': return `<div ${A.replace('b-heading','b-h')} data-lvl="${b.level||1}"
      contenteditable="true" spellcheck="false">${esc(b.text)}</div>`;
    case 'paragraph': return `<div ${A.replace('b-paragraph','b-p')} contenteditable="true"
      spellcheck="false">${runsHTML(b.runs)}${cond}</div>`;
    case 'list': return `<ul ${A.replace('b-list','b-list')} data-ord="${b.ordered?1:0}">
      ${b.items.map((t,ii)=>`<li contenteditable="true" data-li="${ii}" spellcheck="false">${esc(t)}</li>`).join('')}</ul>`;
    case 'divider': return `<div ${A.replace('b-divider','b-div')}></div>`;
    case 'media': {
      const wpx=`width:${b.w}%`, hpx=b.h?`height:${b.h}px`:'height:120px';
      const inner=b.kind==='video'
        ? `<div style="position:absolute;inset:0;background:${GRADS[b.src]||GRADS['grad-4']}"></div>
           <div class="playbtn">${icon('play',14)}</div>`
        : (GRADS[b.src]?`<div style="position:absolute;inset:0;background:${GRADS[b.src]}"></div>`
           :`<div class="ph">${icon('image',20)}<span>${esc(b.alt||'Image')}</span></div>`);
      return `<div ${A} style="${wpx};${hpx};--mfit:${b.fit||'cover'}">${inner}
        ${b.caption?`<div class="cap">${esc(b.caption)}</div>`:''}</div>`;
    }
    case 'callout': return `<div ${A} data-tone="${b.tone}">
      <span class="ci">${icon(b.tone==='success'?'check':b.tone==='warning'?'alert':'info',15)}</span>
      <span contenteditable="true" spellcheck="false" style="flex:1">${esc(b.text)}</span>${cond}</div>`;
    case 'stat': return `<div ${A} data-em="${b.emphasis}"><div><div class="sv"
      contenteditable="true" spellcheck="false">${esc(b.value)}</div>
      <div class="sl" contenteditable="true" spellcheck="false">${esc(b.label)}</div></div></div>`;
    case 'icon': return `<div ${A}><span class="iw">${icon(ICONS_B[b.icon]||'sparkle',16)}</span>
      <span class="it" contenteditable="true" spellcheck="false">${esc(b.text)}</span></div>`;
    case 'formField': {
      const rr={theme:'var(--b-radius)',square:'0px',soft:'8px',round:'999px'}[b.radius||'theme'];
      let ctl='';
      if(b.control==='text') ctl=`<input type="text" placeholder="${esc(b.placeholder||'')}" readonly style="--fr:${rr}">`;
      else if(b.control==='checkbox') ctl=`<div class="opt"><span class="bx"></span>
        <span contenteditable="true" spellcheck="false">${esc(b.label)}</span></div>`;
      else ctl=`<div class="opts">${(b.options||[]).map(o=>`<div class="opt"><span class="bx radio"></span>
        <span>${esc(o)}</span></div>`).join('')}</div>`;
      return `<div ${A} data-ctl="${b.control}" data-size="${b.size}">
        ${b.control!=='checkbox'?`<div class="fl">${esc(b.label)}${b.required?' <span class="req">*</span>':''}</div>`:''}
        ${ctl}</div>`;
    }
    case 'actions': return `<div ${A.replace('b-actions','b-acts')} data-layout="${b.layout}"
      data-align="${b.align}" style="gap:${b.gap}px">${b.items.map(a=>ctaHTML(a)).join('')}</div>`;
    case 'targetChip': return `<div ${A.replace('b-targetChip','b-chip')}>${icon('target',13)}
      <span contenteditable="true" spellcheck="false">${esc(b.text)}</span></div>`;
    case 'validationBadge': return `<div ${A.replace('b-validationBadge','b-badge')} data-s="${b.state}">
      ${icon(b.state==='ok'?'check':b.state==='warn'?'alert':'x',13)}<span>${esc(b.text)}</span></div>`;

}
function ctaHTML(a){
  const rr={theme:'var(--b-btn-r)',square:'0px',soft:'8px',round:'999px'}[a.radius||'theme'];
  const st=[`border-radius:${rr}`];

  const selc=S.sel.actionId===a.id?' data-sel="1"':'';
  return `<button class="cta" data-act="${a.id}" data-v="${a.variant}" data-size="${a.size}"
    style="${st.join(';')}"${selc}>${a.iconPlace!=='end'?ic:''}
    <span contenteditable="true" spellcheck="false">${esc(a.label)}</span>${a.iconPlace==='end'?ic:''}</button>`;

function drawCard(){
  const s=step(), c=$('#card'), wrap=$('#cwrap');
  if(!s){c.innerHTML='';return}
  const sty=STEP_STYLES[s.style]||STEP_STYLES['Primary card'];
  const ov=s.overrides||{};
  /* named step style → token bindings (§6.1 layer 3), then instance overrides (layer 4) */
  const pad={compact:12,standard:18,relaxed:24}[ov.padding||sty.padding]||18;
  const rad={theme:null,square:0,soft:8,round:22}[ov.radius?(ov.radiusVal||'soft'):sty.radius];
  const bw={theme:null,none:0,subtle:1,strong:2}[ov.border||sty.border];
  const elev={theme:null,none:'none',resting:'0 2px 8px -2px rgba(16,24,40,.16)',
    floating:'0 22px 52px -12px rgba(16,24,40,.4)'}[ov.elevation||sty.elevation];
  c.style.padding=pad+'px';
  c.style.borderRadius=rad==null?'':rad+'px';
  c.style.borderWidth=bw==null?'':bw+'px';
  c.style.boxShadow=elev==null?'':elev;
  /* A colour scheme is a whole named set of roles (§4.3), not one background.
     Rebinding the roles on the card element is what keeps every nested control
     readable without a single per-block override. */
  const th={...THEMES[DOC.activeTheme],...DOC.themeOverrides};
  ['--b-surface','--b-ink','--b-body','--b-accent','--b-onaccent','--b-border']
    .forEach(k=>c.style.removeProperty(k));
  c.style.background=''; c.style.color='';
  const scheme=ov.scheme||sty.scheme;
  c.dataset.scheme=scheme;
  const bind=(o)=>Object.entries(o).forEach(([k,v])=>c.style.setProperty(k,v));
  if(scheme==='accent') bind({'--b-surface':th.accent,'--b-ink':th.onaccent,
    '--b-body':mix(th.onaccent,th.accent,.22),'--b-border':mix(th.onaccent,th.accent,.6),
    '--b-accent':th.onaccent,'--b-onaccent':th.accent});
  if(scheme==='muted') bind({'--b-surface':mix(th.surface,th.accent,.07),
    '--b-border':mix(th.border,th.accent,.3)});
  if(scheme==='inverse') bind({'--b-surface':th.ink,'--b-ink':th.surface,
    '--b-body':mix(th.surface,th.ink,.28),'--b-border':mix(th.surface,th.ink,.68),
    '--b-accent':mix(th.accent,th.surface,.45)});
  c.style.background='var(--b-surface)'; c.style.color='var(--b-ink)';
  if(ov.surface) c.style.background=ov.surface;
  if(ov.ink) c.style.color=ov.ink;

  c.innerHTML=s.blocks.map((b,i)=>blockHTML(b,i)).join('')+
    (s.form==='tooltip'&&s.target&&findTargetEl(s.target)?`<span class="arrow"></span>`:'');
  c.style.width=s.w+'px';
  if(s.h) c.style.minHeight=s.h+'px'; else c.style.minHeight='';
  wrap.style.width=s.w+'px';
  bindCardEditing();
  positionArrow();
}
function positionArrow(){
  const a=$('#card .arrow'); if(!a) return;
  const s=step(), side=s.placement.side, half=6;
  a.style.left=''; a.style.right=''; a.style.top=''; a.style.bottom='';
  a.style.clipPath='';
  const align=s.placement.align, pos=align==='start'?'26px':align==='end'?'calc(100% - 38px)':'calc(50% - 6px)';
  if(side==='bottom'){a.style.top=-half-1+'px';a.style.left=pos;a.style.clipPath='polygon(0 0,100% 0,100% 100%)'}
  if(side==='top'){a.style.bottom=-half-1+'px';a.style.left=pos;a.style.clipPath='polygon(0 0,100% 100%,0 100%)'}
  if(side==='right'){a.style.left=-half-1+'px';a.style.top=pos;a.style.clipPath='polygon(0 0,0 100%,100% 100%)'}
  if(side==='left'){a.style.right=-half-1+'px';a.style.top=pos;a.style.clipPath='polygon(0 0,100% 0,100% 100%)'}
}

/* ── selection + inline editing ───────────────────────────────────────── */
let commitTimer=null;
function bindCardEditing(){
  const c=$('#card');
  $$('[data-blk]',c).forEach(n=>{
    const id=n.dataset.blk, b=step().blocks.find(x=>x.id===id);
    n.addEventListener('pointerdown',e=>{
      if(S.mode==='preview') return;
      if(e.target.closest('[data-act]')) return;
      if(b.type==='media'&&e.target.closest('.mrz')) return;
      selectBlock(id);
    });
    if(b.type==='actions'){
      $$('[data-act]',n).forEach(btn=>{
        if(S.mode==='preview'){
          btn.onclick=()=>runtimeAction(b.items.find(x=>x.id===btn.dataset.act));
          return;
        }
        btn.addEventListener('pointerdown',e=>{
          if(e.target.isContentEditable&&e.detail>1) return;
          selectAction(id,btn.dataset.act);
          startActionDrag(e,btn,b);
        });
      });
    }
  });
  $$('[contenteditable]',c).forEach(n=>{
    n.addEventListener('input',()=>{ clearTimeout(commitTimer); commitTimer=setTimeout(commitText,240); markDirty(); });
    n.addEventListener('blur',commitText);
    n.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey&&n.closest('.b-h,.cta,.sv,.sl')){e.preventDefault();n.blur()}
      if(e.key==='Escape'){n.blur()}
      e.stopPropagation();
    });
    n.addEventListener('mouseup',()=>{ setTimeout(reflectTextSelection,0) });
    n.addEventListener('keyup',()=>{ setTimeout(reflectTextSelection,0) });

function reflectTextSelection(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed) return;
  const node=sel.anchorNode; if(!node) return;
  const blk=(node.nodeType===1?node:node.parentElement)?.closest('[data-blk]');
  if(!blk||!$('#card').contains(blk)) return;
  if(S.sel.kind!=='text'){ S.sel={kind:'text',blockId:blk.dataset.blk,actionId:null}; drawToolbar(true) }
}
function commitText(){
  const s=step(); if(!s) return; let changed=false;
  $$('#card [data-blk]').forEach(n=>{
    const b=s.blocks.find(x=>x.id===n.dataset.blk); if(!b) return;
    if(b.type==='heading'){ const t=n.textContent; if(t!==b.text){b.text=t;changed=true} }
    if(b.type==='paragraph'){
      const t=n.textContent;
      if(t!==textOf(b)){ b.runs=parseRuns(n); changed=true }
    }
    if(b.type==='list'){ $$('[data-li]',n).forEach(li=>{const i=+li.dataset.li;
      if(b.items[i]!==li.textContent){b.items[i]=li.textContent;changed=true}}) }
    if(b.type==='callout'||b.type==='icon'||b.type==='targetChip'){
      const sp=$('[contenteditable]',n); if(sp&&sp.textContent!==b.text){b.text=sp.textContent;changed=true} }
    if(b.type==='stat'){ const v=$('.sv',n),l=$('.sl',n);
      if(v.textContent!==b.value){b.value=v.textContent;changed=true}
      if(l.textContent!==b.label){b.label=l.textContent;changed=true} }
    if(b.type==='formField'&&b.control==='checkbox'){ const sp=$('[contenteditable]',n);
      if(sp&&sp.textContent!==b.label){b.label=sp.textContent;changed=true} }
    if(b.type==='actions'){ $$('[data-act]',n).forEach(btn=>{
      const a=b.items.find(x=>x.id===btn.dataset.act); const sp=$('[contenteditable]',btn);
      if(a&&sp&&sp.textContent.trim()!==a.label){a.label=sp.textContent.trim();changed=true}}) }
  });
  if(changed){ markDirty(); drawFilm(); }
}
/* preserve b/i/u/colour/link when committing a paragraph */
function parseRuns(node){
  const out=[];
  (function walk(n,marks,color,href,size){
    n.childNodes.forEach(ch=>{
      if(ch.nodeType===3){ if(ch.nodeValue) out.push({t:ch.nodeValue,marks:[...marks],
        ...(color?{color}:{}),...(href?{href}:{}),...(size?{size}:{})}); return }
      if(ch.nodeType!==1) return;
      const m=[...marks], tg=ch.tagName.toLowerCase();
      if(tg==='b'||tg==='strong') m.push('bold');
      if(tg==='i'||tg==='em') m.push('italic');
      if(tg==='u') m.push('underline');
      const st=ch.style||{};
      walk(ch,m,st.color||color,ch.dataset?.href||(tg==='a'?ch.getAttribute('data-href'):null)||href,
        st.fontSize?parseInt(st.fontSize):size);
    });
  })(node,[],null,null,null);
  return out.length?out:[{t:node.textContent,marks:[]}];
}

/* ── Tier 1: drag a button onto another to JOIN the row, out to SPLIT ── */
function startActionDrag(e,btn,block){
  if(e.target.isContentEditable&&document.activeElement===e.target) return;
  const sx=e.clientX, sy=e.clientY; let moved=false, ghost=null;
  const items=block.items, id=btn.dataset.act;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<5) return;
    if(!moved){ moved=true; btn.style.opacity='.35';
      ghost=el('div','',btn.outerHTML); ghost.style.cssText=
        'position:fixed;z-index:200;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)';
      document.body.appendChild(ghost); }
    ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
    const over=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-act]');
    $$('#card [data-act]').forEach(n=>n.style.outline='');
    if(over&&over!==btn) over.style.outline='2px solid var(--c-action)';
    const outside=!$('#card').contains(document.elementFromPoint(ev.clientX,ev.clientY));
    document.body.style.cursor=outside?'copy':'grabbing';
  };
  const up=ev=>{
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up);
    document.body.style.cursor='';
    if(ghost) ghost.remove();
    $$('#card [data-act]').forEach(n=>n.style.outline='');
    if(!moved) return;
    const overEl=document.elementFromPoint(ev.clientX,ev.clientY);
    const over=overEl?.closest('[data-act]');
    pushUndo('move action');
    if(over&&over!==btn){
      const from=items.findIndex(x=>x.id===id), to=items.findIndex(x=>x.id===over.dataset.act);
      const [it]=items.splice(from,1); items.splice(to,0,it);
      if(block.layout==='stack'){ block.layout='inline'; toast('Buttons joined onto one row.','',2600) }
      else toast('Reordered.','',1800);
    } else if(!$('#card').contains(overEl)){
      block.layout='stack'; block.align='stretch';
      toast('Split onto separate rows.','',2600);
    }
    paint();
  };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
}

function menu(anchor,html,opts={}){

  $('#floats').appendChild(m);
