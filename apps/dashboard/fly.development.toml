app = "lodariq-dashboard-dev"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LODARIQ_AUTH_MODE = "lodariq"
  LODARIQ_API_BASE_URL = "https://dev-api.lodariq.io"
  LODARIQ_PUBLIC_SIGNUP_MODE = "email-verification"
  LODARIQ_PASSWORD_RECOVERY_MODE = "email"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"
