app = "lodariq-api-staging"
primary_region = "fra"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "3001"
  LODARIQ_AUTH_MODE = "lodariq"
  LODARIQ_AUTH_ALLOWED_ORIGINS = "https://staging-app.lodariq.io"
  LODARIQ_EMAIL_DELIVERY_MODE = "disabled"
  LODARIQ_PASSWORD_RECOVERY_MODE = "disabled"
  LODARIQ_PUBLIC_SIGNUP_MODE = "disabled"
  LODARIQ_PASSWORD_HASH_MAX_ACTIVE = "1"
  LODARIQ_PASSWORD_HASH_MAX_QUEUED = "8"
  LODARIQ_PASSWORD_HASH_QUEUE_TIMEOUT_MS = "2000"
  LODARIQ_PUBLIC_API_BASE_URL = "https://staging-api.lodariq.io"
  LODARIQ_LOADER_SRC = "https://staging-cdn.lodariq.io/sdk/lodariq-loader.js"
  LODARIQ_PUBLIC_LOADER_SRC = "https://staging-cdn.lodariq.io/sdk/lodariq-public-bootstrap.js"
  LODARIQ_CREATOR_LOADER_SRC = "https://staging-cdn.lodariq.io/sdk/lodariq-creator.js"
  LODARIQ_AUTHORING_IFRAME_SRC = "https://staging-editor.lodariq.io/authoring.html"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  path = "/readyz"
  timeout = "3s"
