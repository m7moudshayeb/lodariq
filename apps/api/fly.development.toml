app = "lodariq-api-dev"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "3001"
  LODARIQ_APP_BASE_URL = "https://dev-app.lodariq.io"
  LODARIQ_AUTH_MODE = "lodariq"
  LODARIQ_AUTH_ALLOWED_ORIGINS = "https://dev-app.lodariq.io"
  LODARIQ_AUTH_EMAIL_FROM = "Lodariq Development <access@dev.lodariq.io>"
  LODARIQ_EMAIL_DELIVERY_MODE = "resend"
  LODARIQ_PASSWORD_RECOVERY_MODE = "email"
  LODARIQ_PUBLIC_SIGNUP_MODE = "email-verification"
  LODARIQ_PASSWORD_HASH_MAX_ACTIVE = "1"
  LODARIQ_PASSWORD_HASH_MAX_QUEUED = "8"
  LODARIQ_PASSWORD_HASH_QUEUE_TIMEOUT_MS = "2000"
  LODARIQ_PUBLIC_API_BASE_URL = "https://dev-api.lodariq.io"
  LODARIQ_LOADER_SRC = "https://dev-cdn.lodariq.io/sdk/lodariq-loader.js"
  LODARIQ_PUBLIC_LOADER_SRC = "https://dev-cdn.lodariq.io/sdk/lodariq-public-bootstrap.js"
  LODARIQ_CREATOR_LOADER_SRC = "https://dev-cdn.lodariq.io/sdk/lodariq-creator.js"
  LODARIQ_AUTHORING_IFRAME_SRC = "https://dev-editor.lodariq.io/authoring.html"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "15s"
  method = "GET"
  path = "/readyz"
  timeout = "3s"
